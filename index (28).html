<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#F8F9FB; --ink:#172031; --ink-2:#556074; --ink-3:#8B94A5;
  --line:#E2E6EC; --line-2:#EEF1F4;
  --accent:#0F7C7A; --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent); --accent-ink:#fff;
  --p1:#D9473F; --p2:#E3862B; --p3:#CFA52A; --p4:#AEB5C1;
  --ok:#2E9B6A; --full:#D99A1E; --over:#D9473F;
  --event:#2D3A55;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(23,32,49,.05),0 8px 24px -12px rgba(23,32,49,.12);
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#12161E; --surface:#1A1F2A; --surface-2:#202634; --ink:#E9ECF2; --ink-2:#A6AEBD; --ink-3:#727B8C;
  --line:#2B3241; --line-2:#242A37; --event:#C9D3E8; --accent-soft:color-mix(in srgb,var(--accent) 22%,transparent);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161E; --surface:#1A1F2A; --surface-2:#202634; --ink:#E9ECF2; --ink-2:#A6AEBD; --ink-3:#727B8C;
    --line:#2B3241; --line-2:#242A37; --event:#C9D3E8; --accent-soft:color-mix(in srgb,var(--accent) 22%,transparent);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ic{flex:none;display:block}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 300px;min-height:100vh}
body.wide .app{grid-template-columns:232px minmax(0,1fr)}
body.wide .aside{display:none}
.sidebar{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;font:600 22px/1 var(--f-display);letter-spacing:-.01em}
.brand-mark{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 12%,var(--accent) 13% 100%);box-shadow:0 0 0 4px var(--accent-soft)}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:none;color:var(--ink-2);text-align:left;font-weight:500}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav-btn .count{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav-btn .count.alert{color:var(--over);font-weight:600}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.side-capture{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.sync{font-size:12px;color:var(--ink-3);padding:10px 10px 0;display:flex;gap:6px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.cloud i{background:var(--ok)}

.main{min-width:0;padding:28px 36px 60px}
.searchbar{display:flex;align-items:center;gap:10px;max-width:420px;margin:0 0 26px auto;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink-3);cursor:text}
.searchbar span{flex:1}
.searchbar kbd{font:12px var(--f-ui);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.page{max-width:780px;margin:0 auto}
body.wide .page{max-width:none}

.aside{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 22px;border-left:1px solid var(--line)}
.aside h3{font:600 13px/1 var(--f-ui);color:var(--ink-3);margin:0 0 14px}
.aside section+section{margin-top:30px}
.next-item{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.next-item b{font-weight:600;font-variant-numeric:tabular-nums}
.next-item small{display:block;color:var(--ink-3)}
.note-input{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}

.topbar,.bottomnav{display:none}

/* ============ TYPE ============ */
h1,h2{margin:0}
.page-title{font:500 34px/1.1 var(--f-display);letter-spacing:-.02em;margin:0 0 6px;font-variation-settings:"opsz" 96}
.page-sub{color:var(--ink-2);margin:0 0 26px}
.block{margin-top:30px}
.block>h2,.block-h{display:flex;align-items:center;gap:10px;font:600 15px/1.3 var(--f-ui);margin:0 0 10px;color:var(--ink)}
.block-h .muted,.block>h2 .muted{font-weight:500;color:var(--ink-3)}
.block-h .spacer{flex:1}
.muted{color:var(--ink-3)}
.empty{padding:22px;border:1px dashed var(--line);border-radius:var(--r-md);color:var(--ink-2);text-align:center}
.empty button{margin-top:10px}

/* ============ BUTTONS & INPUTS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--over)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.icon{width:38px;padding:0}
.btn.sm.icon{width:30px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:13px;color:var(--ink-2);font-weight:500}
.input,select.input,textarea.input{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.toggle small{display:block;color:var(--ink-3)}
.switch{appearance:none;width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(16px)}

/* ============ TODAY ============ */
.today-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.greet{font:400 44px/1.05 var(--f-display);letter-spacing:-.025em;font-variation-settings:"opsz" 144}
.date{margin:8px 0 0;color:var(--ink-2)}
.head-actions{display:flex;gap:8px}
.daycard{background:var(--surface);border-radius:var(--r-lg);padding:22px 22px 18px;box-shadow:var(--shadow)}
.day-sentence{margin:0 0 18px;font:400 21px/1.35 var(--f-display);letter-spacing:-.01em;max-width:34ch}
.lvl{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.lvl::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.lvl.ok{color:var(--ok)} .lvl.full{color:var(--full)} .lvl.over{color:var(--over)}
.daystrip{position:relative;height:40px;border-radius:10px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line-2)}
.daystrip .past{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line-2) 6px 7px)}
.daystrip .b{position:absolute;top:6px;bottom:6px;border-radius:6px;min-width:3px}
.daystrip .b.task{background:var(--accent);opacity:.85}
.daystrip .b.event{background:var(--event)}
.daystrip .b.break{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px)}
.daystrip .b.done{opacity:.3}
.daystrip .now{position:absolute;top:0;bottom:0;width:2px;background:var(--over)}
.strip-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums}
.day-figs{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;color:var(--ink-2);font-size:14px}
.day-figs b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.hint{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px;padding:14px 16px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--ink)}
.hint.over{background:color-mix(in srgb,var(--over) 10%,transparent)}
.hint p{margin:0;flex:1 1 260px}
.hint .acts{display:flex;gap:6px;flex-wrap:wrap}

.dontforget{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.df-card{flex:0 0 auto;max-width:240px;display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--p1);text-align:left}
.df-card small{display:block;color:var(--ink-3);margin-top:2px}

/* ============ TASK ROWS ============ */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.list.flat{box-shadow:none;border:1px solid var(--line)}
.trow{display:flex;align-items:flex-start;gap:12px;padding:12px 10px 12px 14px;border-bottom:1px solid var(--line-2);position:relative;background:var(--surface)}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface-2)}
.trow[draggable="true"]{cursor:grab}
.trow.dragging{opacity:.4}
.check{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:2px solid var(--p4);background:transparent;display:grid;place-items:center;color:transparent;padding:0}
.trow.p1 .check{border-color:var(--p1)} .trow.p2 .check{border-color:var(--p2)} .trow.p3 .check{border-color:var(--p3)}
.check:hover{color:var(--ink-3)}
.trow.done .check{background:var(--ink-3);border-color:var(--ink-3);color:var(--surface)}
.kind-ic{flex:none;width:22px;height:22px;margin-top:1px;border-radius:7px;display:grid;place-items:center;background:var(--event);color:var(--surface)}
.kind-ic.reminder{background:var(--accent-soft);color:var(--accent)}
.tmain{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left}
.ttitle{font-weight:500;line-height:1.35;word-break:break-word}
.trow.done .ttitle{text-decoration:line-through;color:var(--ink-3)}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;font-size:13px;color:var(--ink-3);align-items:center}
.tmeta .t{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:500}
.tmeta .over{color:var(--over);font-weight:600}
.tmeta .post{color:var(--full);font-weight:600}
.tmeta .ico{display:inline-flex;align-items:center;gap:3px}
.pchip{display:inline-flex;align-items:center;gap:5px}
.pchip i{width:8px;height:8px;border-radius:50%}
.prio-flag{font-size:12px;font-weight:600}
.prio-flag.p1{color:var(--p1)} .prio-flag.p2{color:var(--p2)}
.tmore{flex:none;border:0;background:none;color:var(--ink-3);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;margin:-5px -2px 0 0}
.tmore:hover{background:var(--line-2);color:var(--ink)}
.tl{display:flex;flex-direction:column;gap:0}
.tl-row{display:grid;grid-template-columns:56px 1fr;gap:6px;align-items:start}
.tl-time{padding-top:13px;font-size:13px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right;padding-right:6px}
.tl-row .trow{border-radius:0}
.now-line{display:grid;grid-template-columns:56px 1fr;gap:6px;align-items:center;margin:4px 0;color:var(--over);font-size:12px;font-weight:600}
.now-line span{text-align:right;padding-right:6px}
.now-line i{height:2px;background:var(--over);border-radius:2px;position:relative}
.now-line i::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--over)}
details.block summary{cursor:pointer;font-weight:600;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:8px}
details.block summary::-webkit-details-marker{display:none}
details.block[open] summary{margin-bottom:10px}

/* ============ ROUTINES ============ */
.routine{background:var(--surface);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow)}
.routine+.routine{margin-top:12px}
.routine h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.routine .prog{font-size:13px;color:var(--ink-3);font-weight:500}
.ritem{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
.ritem input{width:18px;height:18px;accent-color:var(--accent)}
.ritem.on span{text-decoration:line-through;color:var(--ink-3)}
.days-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.days-row button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink-2);padding:0}
.days-row button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.routines-today{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.routines-today .routine+.routine{margin-top:0}

/* ============ AGENDA ============ */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar .title{font:500 26px/1.1 var(--f-display);letter-spacing:-.015em;margin-right:auto;text-transform:capitalize}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.month .dow{padding:8px 10px;font-size:12px;color:var(--ink-3);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.mcell{min-height:112px;padding:6px 6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;background:var(--surface);border-top:0;border-left:0;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcell:hover{background:var(--surface-2)}
.mcell.out{background:var(--surface-2)}
.mcell.out .dnum{color:var(--ink-3)}
.dnum{font-size:13px;font-weight:600;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.mcell.today .dnum{background:var(--accent);color:var(--accent-ink)}
.mev{font-size:12px;line-height:1.3;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--accent-soft);color:var(--ink)}
.mev.event{background:var(--event);color:var(--surface)}
.mev.done{opacity:.45;text-decoration:line-through}
.mmore{font-size:12px;color:var(--ink-3);padding-left:6px}
.mdots{display:none}
.tgrid{display:grid;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.tg-head{display:grid;border-bottom:1px solid var(--line)}
.tg-head div{padding:10px 8px;font-size:13px;color:var(--ink-2);border-left:1px solid var(--line-2);text-align:center}
.tg-head div.today{color:var(--accent);font-weight:600}
.tg-head b{display:block;font:500 20px/1.2 var(--f-display);color:var(--ink)}
.tg-allday{display:grid;border-bottom:1px solid var(--line)}
.tg-allday>div{border-left:1px solid var(--line-2);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tg-body{display:grid;position:relative;max-height:68vh;overflow-y:auto}
.tg-hours div{height:52px;font-size:11px;color:var(--ink-3);text-align:right;padding:0 6px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
.tg-col{position:relative;border-left:1px solid var(--line-2);background-image:linear-gradient(var(--line-2) 1px,transparent 1px);background-size:100% 52px}
.tg-slot{position:absolute;left:0;right:0;height:26px;border:0;background:none;padding:0}
.tg-slot:hover{background:var(--accent-soft)}
.tg-ev{position:absolute;border-radius:7px;padding:4px 7px;font-size:12px;line-height:1.25;overflow:hidden;text-align:left;border:0;background:var(--accent-soft);color:var(--ink);border-left:3px solid var(--accent);z-index:1}
.tg-ev.event{background:var(--event);color:var(--surface);border-left-color:var(--event)}
.tg-ev.done{opacity:.45}
.tg-ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-now{position:absolute;left:0;right:0;height:2px;background:var(--over);z-index:2}
.legend-row{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:12px}

/* ============ PLANNER ============ */
.planner{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 210px;gap:10px;align-items:start}
.pday{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:340px;min-width:0;transition:box-shadow .15s}
.pday.drop-on,.ptray.drop-on{box-shadow:0 0 0 2px var(--accent)}
.pday-h{padding:12px 12px 10px;border-bottom:1px solid var(--line-2)}
.pday-h .dname{font-weight:600;text-transform:capitalize;display:flex;align-items:center;gap:8px}
.pday-h .dname .lvl::before{width:8px;height:8px}
.pday.today .pday-h{border-bottom-color:var(--accent)}
.pday.today .dname{color:var(--accent)}
.pday-h small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.pbar{height:4px;border-radius:4px;background:var(--line-2);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok)}
.pbar.full i{background:var(--full)} .pbar.over i{background:var(--over)}
.pitems{padding:6px;display:flex;flex-direction:column;gap:5px;flex:1}
.pcard{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line-2);font-size:13px;min-width:0}
.pcard[draggable="true"]{cursor:grab}
.pcard.event{background:var(--event);color:var(--surface);border-color:var(--event)}
.pcard.done .pt{text-decoration:line-through;opacity:.55}
.pcard .pt{flex:1;min-width:0;word-break:break-word;border:0;background:none;padding:0;text-align:left;color:inherit;line-height:1.3}
.pcard .pt small{display:block;opacity:.7;font-variant-numeric:tabular-nums}
.pcard .pdot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex:none;background:var(--p4)}
.pcard.p1 .pdot{background:var(--p1)} .pcard.p2 .pdot{background:var(--p2)} .pcard.p3 .pdot{background:var(--p3)}
.pcard .tmore{width:24px;height:24px;margin:-3px -3px 0 0;color:inherit;opacity:.6}
.padd{margin:4px 6px 8px;border:1px dashed var(--line);background:none;border-radius:8px;padding:6px;color:var(--ink-3);font-size:13px}
.padd:hover{color:var(--ink);border-color:var(--ink-3)}
.ptray{background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r-md);padding:10px;min-height:340px;position:sticky;top:20px}
.ptray h3{margin:2px 2px 4px;font-size:14px}
.ptray p{margin:0 2px 10px;font-size:12px;color:var(--ink-3)}
.ptray .pitems{padding:0}

/* ============ PROJECTS / NOTES / SUMMARY ============ */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard-big{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);text-align:left;border:0;display:flex;flex-direction:column;gap:10px}
.pcard-big h3{margin:0;font-size:17px;display:flex;align-items:center;gap:10px}
.pcard-big h3 i{width:12px;height:12px;border-radius:4px}
.pcard-big .progress{height:6px;background:var(--line-2);border-radius:6px;overflow:hidden}
.pcard-big .progress i{display:block;height:100%;background:var(--accent)}
.pcard-big ul{margin:0;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
.pcard-big li{padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.area-h{font:500 20px/1.2 var(--f-display);margin:28px 0 12px}
.note{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.note+.note{margin-top:10px}
.note p{margin:0;flex:1;white-space:pre-wrap;word-break:break-word}
.note small{display:block;color:var(--ink-3);margin-top:4px}
.note .acts{display:flex;gap:4px;flex:none}
.capture-box{display:flex;gap:10px;align-items:flex-end;background:var(--surface);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow);margin-bottom:22px}
.capture-box textarea{flex:1;border:0;outline:none;background:none;resize:none;min-height:48px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font:500 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.weekbars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;background:var(--surface);border-radius:var(--r-md);padding:18px 16px 12px;box-shadow:var(--shadow)}
.wb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.wb .bars{height:130px;width:100%;max-width:44px;display:flex;align-items:flex-end;gap:3px}
.wb .bars i{flex:1;border-radius:5px 5px 2px 2px;background:var(--line);min-height:2px}
.wb .bars i.d{background:var(--accent)}
.insight{margin:0;padding:14px 16px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow)}
.insight+.insight{margin-top:8px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters-2{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filters-2 select{width:auto;min-width:160px}
.group-h{font-size:13px;font-weight:600;color:var(--ink-2);margin:20px 0 8px;text-transform:capitalize}
.settings-sec{background:var(--surface);border-radius:var(--r-lg);padding:6px 20px 14px;box-shadow:var(--shadow);margin-bottom:18px}
.settings-sec h2{font:600 15px/1 var(--f-ui);margin:16px 0 8px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:10px 0}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

/* ============ MODAL / SHEET ============ */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
.scrim{position:absolute;inset:0;background:rgba(15,20,30,.38);backdrop-filter:blur(2px);animation:fade .15s}
.dialog{position:relative;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);padding:22px;animation:pop .18s ease-out}
.dialog.sm{width:min(400px,100%)}
.dialog.lg{width:min(680px,100%)}
.dialog h2{font:500 24px/1.15 var(--f-display);margin:0 0 4px;letter-spacing:-.01em}
.dialog .sub{color:var(--ink-2);margin:0 0 16px}
.dialog-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.dialog-foot .left{margin-right:auto}
.x{position:absolute;top:14px;right:14px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes up{from{transform:translateY(100%)}}
.sheet-list{display:flex;flex-direction:column;gap:4px}
.sheet-list button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:0;border-radius:10px;background:none;font-weight:500}
.sheet-list button:hover{background:var(--surface-2)}
.sheet-list button small{margin-left:auto;color:var(--ink-3);font-weight:400}
.sheet-list button.danger{color:var(--over)}
.sheet-list hr{border:0;height:1px;background:var(--line);margin:4px 0;width:100%}

.qc-input{width:100%;border:0;outline:none;background:none;font:400 22px/1.35 var(--f-display);resize:none;min-height:64px;padding:4px 0}
.qc-wrap{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:10px}
.mic{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.mic.on{background:var(--over);border-color:var(--over);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--over) 20%,transparent)}}
.parsed{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px;min-height:30px}
.parsed span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.parsed span b{font-weight:600}
.qc-examples{font-size:13px;color:var(--ink-3);margin:10px 0 0}
.qc-examples button{border:0;background:none;color:var(--accent);padding:0;font-size:13px;text-align:left}

.sub-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.sub-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.sub-row input[type=text]{flex:1}
.plan-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}
.plan-item{display:grid;grid-template-columns:96px 1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-2);font-size:14px;align-items:center}
.plan-item:last-child{border-bottom:0}
.plan-item .pt{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.plan-item.break{background:var(--surface-2);color:var(--ink-3)}
.plan-item.event .nm::before{content:"Compromisso · ";color:var(--ink-3)}
.plan-item.new{background:var(--accent-soft)}
.plan-item small{color:var(--ink-3)}
.warnbox{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--over) 10%,transparent);margin:12px 0}
.warnbox p{margin:0 0 6px}

/* ============ FOCUS ============ */
.focus{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;animation:fade .2s}
.focus .lbl{color:var(--ink-3);font-weight:500}
.focus h1{font:400 clamp(32px,6vw,58px)/1.08 var(--f-display);letter-spacing:-.025em;margin:12px 0;max-width:18ch}
.focus .clock{font:300 64px/1 var(--f-display);font-variant-numeric:tabular-nums;margin:14px 0 6px}
.focus .ring{width:min(360px,80vw);height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 26px}
.focus .ring i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.focus .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.focus .acts .btn{min-height:48px;padding:0 22px;font-size:16px}
.focus .subs{text-align:left;margin:0 0 22px;min-width:260px}
.focus .x{position:fixed;top:calc(16px + env(safe-area-inset-top,0px))}

/* ============ TOASTS ============ */
.toasts{position:fixed;right:20px;bottom:20px;z-index:70;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100vw - 32px))}
.toast{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.35);padding:14px 16px;animation:pop .2s}
.toast b{display:block;margin-bottom:2px}
.toast p{margin:0;color:var(--ink-2);font-size:14px}
.toast .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.toast.persist{border-left:4px solid var(--over)}
.snack{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:14px;animation:pop .2s}
.snack button{margin-left:auto;border:0;background:none;color:var(--bg);font-weight:600;text-decoration:underline}

/* ============ SEARCH ============ */
.search-input{width:100%;border:0;outline:none;background:none;font-size:20px;padding:6px 0 12px;border-bottom:1px solid var(--line)}
.sres{margin-top:12px;max-height:60vh;overflow:auto}
.sres h4{font-size:12px;color:var(--ink-3);margin:14px 0 6px;font-weight:600}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px}
.sres button:hover{background:var(--surface-2)}
.sres small{color:var(--ink-3);margin-left:6px}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}

/* ============ ONBOARDING ============ */
.onb{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:24px;overflow:auto}
.onb-card{width:min(460px,100%);text-align:left}
.onb .orbit{width:84px;height:84px;border-radius:50%;margin-bottom:34px;background:radial-gradient(circle at 34% 34%,#fff 0 9%,var(--accent) 10% 100%);box-shadow:0 0 0 12px var(--accent-soft),0 0 0 26px color-mix(in srgb,var(--accent) 6%,transparent)}
.onb h1{font:400 40px/1.08 var(--f-display);letter-spacing:-.025em;margin:0 0 14px}
.onb p{color:var(--ink-2);font-size:17px;margin:0 0 30px;max-width:36ch}
.onb .dots{display:flex;gap:6px;margin-bottom:22px}
.onb .dots i{width:22px;height:4px;border-radius:4px;background:var(--line)}
.onb .dots i.on{background:var(--accent)}
.onb .foot{display:flex;gap:10px;align-items:center}
.onb .foot .btn{min-height:46px;padding:0 22px}

/* ============ TABLET ============ */
@media (max-width:1199px){
  .app,body.wide .app{grid-template-columns:76px minmax(0,1fr)}
  .aside{display:none}
  .sidebar{padding:18px 10px;align-items:center}
  .brand span,.nav-btn .lbl,.nav-btn .count,.side-capture .lbl,.sync span{display:none}
  .brand{padding:2px 0 18px}
  .nav-btn{justify-content:center;width:48px;padding:11px}
  .side-capture{width:48px;height:48px;border-radius:50%;padding:0}
  .main{padding:24px 26px 60px}
  .planner{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ptray{position:static;grid-column:1/-1;min-height:0}
}

/* ============ MOBILE ============ */
@media (max-width:759px){
  body{font-size:16px}
  .app,body.wide .app{display:block}
  .sidebar{display:none}
  .topbar{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:20;padding:10px 12px 10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
  .topbar .brand{padding:0;font-size:20px;margin-right:auto}
  .main{padding:18px 16px 112px}
  .searchbar{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .bn{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--ink-3);font-size:11px;font-weight:500;padding:6px 0}
  .bn[aria-current="page"]{color:var(--accent)}
  .bn-plus{align-self:center;justify-self:center;width:56px;height:56px;margin-top:-22px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
  .greet{font-size:34px}
  .today-head{align-items:flex-start;flex-direction:column}
  .head-actions{width:100%}
  .head-actions .btn{flex:1;min-height:44px}
  .day-sentence{font-size:19px}
  .page-title{font-size:30px}
  .trow{padding:14px 8px 14px 12px}
  .check,.kind-ic{width:24px;height:24px}
  .tmore{width:38px;height:38px}
  .tl-row,.now-line{grid-template-columns:44px 1fr}
  .tl-time{font-size:12px}
  .planner{grid-template-columns:1fr}
  .pday{min-height:0}
  .pitems{min-height:20px}
  .month .dow{padding:6px 2px;text-align:center;font-size:11px}
  .mcell{min-height:52px;align-items:center;padding:4px 2px}
  .mev,.mmore{display:none}
  .mdots{display:flex;gap:3px;justify-content:center}
  .mdots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .mdots i.event{background:var(--event)}
  .mcell.sel{background:var(--accent-soft)}
  .modal{place-items:end center;padding:0}
  .dialog,.dialog.sm,.dialog.lg{width:100%;border-radius:22px 22px 0 0;max-height:92vh;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
  .dialog-foot .btn{flex:1;min-height:46px}
  .dialog-foot .left{flex:0 0 auto}
  .row3{grid-template-columns:1fr 1fr}
  .toasts{left:16px;right:16px;bottom:auto;top:calc(12px + env(safe-area-inset-top,0px));width:auto}
  .weekbars{gap:4px;padding:14px 8px 10px}
  .filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .filters .chip{flex:none}
  .plan-item{grid-template-columns:76px 1fr}
  .plan-item>:last-child{grid-column:2}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <nav class="sidebar" id="sidebar" aria-label="Navegação principal"></nav>
  <main class="main">
    <button class="searchbar" data-act="search" aria-label="Buscar"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><span>Buscar tarefas, projetos, notas…</span><kbd>/</kbd></button>
    <div id="view"></div>
  </main>
  <aside class="aside" id="aside" aria-label="Próximos"></aside>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Navegação"></nav>
<div class="modal" id="modal" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* ---- core.js ---- */
'use strict';
/* =====================================================================
   NOVA — core: utilitários, dados (Store), sincronização (Sync) e Tarefas
   ===================================================================== */

/* ---------- utilitários ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const todayStr = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = m => { m = Math.max(0, Math.min(1439, Math.round(m))); return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const dt = (date, time) => { const d = parseYmd(date); const m = toMin(time) || 0; d.setHours(Math.floor(m / 60), m % 60, 0, 0); return d.getTime(); };
const fmtDur = m => { m = Math.round(m || 0); if (m < 60) return `${m}min`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h}h${pad(r)}` : `${h}h`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DOW = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const DOW_S = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const weekStart = s => { const d = parseYmd(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return ymd(d); };
const weekDays = start => Array.from({ length: 7 }, (_, i) => addDays(start, i));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const fmtLong = s => { const d = parseYmd(s); return `${cap(DOW[d.getDay()])}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
const fmtShort = s => { const d = parseYmd(s); return `${DOW_S[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };
const relDay = s => { if (!s) return 'Sem data'; const T = todayStr(); if (s === T) return 'Hoje'; if (s === addDays(T, 1)) return 'Amanhã'; if (s === addDays(T, -1)) return 'Ontem'; return fmtShort(s); };
const diffDays = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const lastDayOfMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const clone = o => JSON.parse(JSON.stringify(o));

const PRIORITIES = { 1: 'Importante', 2: 'Alta', 3: 'Normal', 4: 'Baixa' };
const REMINDERS = [[null, 'Sem lembrete'], [0, 'No horário'], [5, '5 min antes'], [15, '15 min antes'], [30, '30 min antes'], [60, '1 hora antes'], [1440, '1 dia antes']];
const ACCENTS = { petroleo: ['Petróleo', '#0F7C7A'], indigo: ['Índigo', '#4F55E3'], ameixa: ['Ameixa', '#8B4FB8'], coral: ['Coral', '#D2583F'], musgo: ['Musgo', '#4E7A3A'], grafite: ['Grafite', '#3B4254'] };
const PROJECT_COLORS = ['#0F7C7A', '#4F55E3', '#D2583F', '#8B4FB8', '#C99A1E', '#4E7A3A', '#3B4254', '#C2477A'];
const reminderLabel = m => { if (m == null) return 'Sem lembrete'; const f = REMINDERS.find(r => r[0] === m); if (f) return f[1]; return m % 1440 === 0 ? `${m / 1440} dias antes` : m % 60 === 0 ? `${m / 60}h antes` : `${m} min antes`; };

    completions: {}, skips: {}, timeOverrides: {}, snoozeUntil: 0,
  }, o);
}

function migrate(s) {
  const base = defaultState();
  s.user = Object.assign({}, base.user, s.user || {});
  s.settings = Object.assign({}, base.settings, s.settings || {});
  s.settings.notif = Object.assign({}, base.settings.notif, (s.settings && s.settings.notif) || {});
  s.settings.lunch = Object.assign({}, base.settings.lunch, (s.settings && s.settings.lunch) || {});
  ['projects', 'tasks', 'notes', 'routines'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  s.tasks = s.tasks.map(t => mkTask(t));
  s.notifLog = s.notifLog || {}; s.dismissed = s.dismissed || {};
  return s;
}

/* ---------- Store: estado local (localStorage) ---------- */
const Store = {
  KEY: 'nova:v1', state: null,
  load() {
    try { const raw = localStorage.getItem(this.KEY); if (raw) this.state = migrate(JSON.parse(raw)); } catch (e) { /* armazenamento indisponível */ }
    if (!this.state) this.state = defaultState();
  },
  persistLocal() { try { localStorage.setItem(this.KEY, JSON.stringify(this.state)); } catch (e) { } },
  save() { this.state.updatedAt = Date.now(); this.persistLocal(); Sync.push(); },
  commit(fn) { fn(this.state); this.save(); if (typeof App !== 'undefined') App.render(); },
};

/* ---------- Sync: nuvem privada por usuário (adaptador trocável, ex.: Supabase) ---------- */
const Sync = {
  ref: null, timer: null, status: 'local', mode: null,
  async init() {
    if (typeof Cloud !== 'undefined' && Cloud.enabled() && Cloud.user) return Cloud.start();
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.ref = db.doc('data/users/' + id + '/nova');
      const snap = await this.ref.get();
      if (snap.exists) {
        const remote = JSON.parse(snap.data().json || 'null');
        if (remote && (remote.updatedAt || 0) > (Store.state.updatedAt || 0)) {
          Store.state = migrate(remote); Store.persistLocal(); App.render(true);
        } else if ((Store.state.updatedAt || 0) > (remote?.updatedAt || 0)) this.push(true);
      } else if (Store.state.updatedAt) this.push(true);
      this.status = 'cloud'; App.renderSync();
    } catch (e) { console.warn('[NOVA] sincronização indisponível', e); }
  },
  push(now) {
    if (this.mode === 'supabase') return Cloud.push(now);
    if (!this.ref) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      const json = JSON.stringify(Store.state);
      if (json.length > 240000) { console.warn('[NOVA] dados grandes demais para a nuvem; mantidos localmente'); return; }
      this.ref.set({ json, updatedAt: Store.state.updatedAt }).catch(e => console.warn('[NOVA] falha ao salvar na nuvem', e));
    }, now ? 0 : 1200);
  },
};

/* ---------- Tarefas, ocorrências e recorrência ---------- */
const Tasks = {
  byId: id => Store.state.tasks.find(t => t.id === id),
  project: id => Store.state.projects.find(p => p.id === id),

  occursOn(t, date) {
    const r = t.recurrence;
    if (!r) return t.date === date;
    if (!t.date || date < t.date) return false;
    if (r.until && date > r.until) return false;
    if (t.skips && t.skips[date]) return false;
    const d0 = parseYmd(t.date), d = parseYmd(date), diff = diffDays(t.date, date);
    switch (r.freq) {
      case 'daily': return diff % (r.interval || 1) === 0;
      case 'interval': return diff % (r.interval || 2) === 0;
      case 'weekdays': return (r.days || []).includes(d.getDay());
      case 'weekly': return diff % (7 * (r.interval || 1)) === 0;
      case 'monthly': { const md = Math.min(r.monthDay || d0.getDate(), lastDayOfMonth(d.getFullYear(), d.getMonth())); return d.getDate() === md; }
      case 'yearly': return d.getMonth() === d0.getMonth() && d.getDate() === Math.min(d0.getDate(), lastDayOfMonth(d.getFullYear(), d.getMonth()));
      default: return false;
    }
  },
  inst(t, date) {
    const rec = !!t.recurrence;
    return {
      t, date, rec, key: t.id + '@' + (date || 'none'),
      time: (date && t.timeOverrides && t.timeOverrides[date]) || t.time,
      dur: t.type === 'reminder' ? 0 : (t.duration || 30),
      done: rec ? !!(t.completions && t.completions[date]) : t.status === 'done',
    };
  },
  on(date) {
    return Store.state.tasks.filter(t => this.occursOn(t, date)).map(t => this.inst(t, date)).sort(this.cmp);
  },
  cmp(a, b) {
    if (a.time && b.time) return a.time.localeCompare(b.time);
    if (a.time) return -1; if (b.time) return 1;
    return a.t.priority - b.t.priority || a.t.createdAt - b.t.createdAt;
  },
  get(key) {
    const [id, date] = key.split('@'); const t = this.byId(id);
    return t ? this.inst(t, date === 'none' ? null : date) : null;
  },
  undated() { return Store.state.tasks.filter(t => !t.date && !t.recurrence && t.status !== 'done').map(t => this.inst(t, null)).sort(this.cmp); },
  overdue() {
    const T = todayStr();
    return Store.state.tasks.filter(t => !t.recurrence && t.status !== 'done' && t.date && t.date < T).map(t => this.inst(t, t.date)).sort((a, b) => a.date.localeCompare(b.date));
  },
  isOverdue(i) {
    if (i.done || !i.date) return false;
    const T = todayStr();
    if (i.date < T) return !i.rec;
    if (i.date === T && i.time && i.t.type !== 'event') return toMin(i.time) + Math.max(i.dur, 15) < nowMin();
    return false;
  },
  range(from, to) { // todas as ocorrências entre datas (inclusive)
    const out = []; for (let d = from; d <= to; d = addDays(d, 1)) out.push(...this.on(d)); return out;
  },
  /* --- mutações (sempre dentro de Store.commit) --- */
  _complete(s, key, val = true) {
    const i = this.get(key); if (!i) return;
    if (i.rec) { i.t.completions = i.t.completions || {}; if (val) i.t.completions[i.date] = true; else delete i.t.completions[i.date]; }
    else { i.t.status = val ? 'done' : 'pending'; i.t.doneAt = val ? Date.now() : null; }
  },
  /* move uma ocorrência; time === undefined mantém o horário; null remove */
  _move(s, key, date, time, postpone = false) {
    const i = this.get(key); if (!i) return null;
    const t = i.t;
    if (i.rec) {
      if (date === i.date) { t.timeOverrides = t.timeOverrides || {}; if (time) t.timeOverrides[i.date] = time; else delete t.timeOverrides[i.date]; return t; }
      t.skips = t.skips || {}; t.skips[i.date] = true;
      const copy = mkTask(Object.assign(clone(t), { id: uid(), recurrence: null, date, time: time === undefined ? i.time : time, completions: {}, skips: {}, timeOverrides: {}, fromSeries: t.id, status: postpone ? 'postponed' : 'pending', postponed: postpone ? 1 : 0, createdAt: Date.now() }));
      s.tasks.push(copy); return copy;
    }
    t.date = date; if (time !== undefined) t.time = time;
    if (postpone) { t.status = 'postponed'; t.postponed = (t.postponed || 0) + 1; }
    t.snoozeUntil = 0;
    return t;
  },
  _remove(s, key, scope = 'one') {
    const i = this.get(key); if (!i) return;
    if (i.rec && scope === 'one') { i.t.skips = i.t.skips || {}; i.t.skips[i.date] = true; return; }
    s.tasks = s.tasks.filter(t => t.id !== i.t.id);
  },
};

/* ---------- Parser: "Me lembra amanhã às 15h de enviar o orçamento" ---------- */
const Parser = (() => {
  const L = '\\p{L}\\d';
  const B = `(?<![${L}])`, E = `(?![${L}])`;
  const R = (s, f = 'iu') => new RegExp(s, f);
  const NUMW = { um: 1, uma: 1, dois: 2, duas: 2, 'três': 3, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, onze: 11, doze: 12, quinze: 15, vinte: 20, trinta: 30, quarenta: 40, cinquenta: 50, meia: 0.5 };
  const num = w => { if (w == null) return null; w = w.toLowerCase(); if (/^\d+([.,]\d+)?$/.test(w)) return parseFloat(w.replace(',', '.')); return NUMW[w] ?? null; };
  const NUM = '(\\d+(?:[.,]\\d+)?|uma?|dois|duas|tr[êe]s|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|quinze|vinte|trinta|quarenta|cinquenta|meia)';
  const DAYRX = '(?:segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo)s?(?:-feiras?)?';
  const MONRX = '(janeiro|fevereiro|mar[çc]o|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)';
  const dayIdx = w => { w = w.toLowerCase(); if (w.startsWith('dom')) return 0; if (w.startsWith('seg')) return 1; if (w.startsWith('ter')) return 2; if (w.startsWith('quar')) return 3; if (w.startsWith('qui')) return 4; if (w.startsWith('sex')) return 5; return 6; };
  const monIdx = w => { w = w.toLowerCase().replace('ç', 'c'); return ['janeiro', 'fevereiro', 'marco', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'].indexOf(w); };
  const PER = '(?:\\s+(?:da|de|à|a|na)\\s+(manh[ãa]|tarde|noite|madrugada))?';
  const HOURW = '(uma|duas|tr[êe]s|quatro|cinco|seis|sete|oito|nove|dez|onze|doze)';

  function parse(text, now = new Date()) {
    let s = ' ' + String(text || '').replace(/\s+/g, ' ').trim() + ' ';
    const T = ymd(now);
    const o = { title: '', date: null, time: null, duration: null, reminder: null, recurrence: null, priority: null, type: null, mustNotForget: false, intent: false };
    const cut = re => { const m = s.match(re); if (m) s = s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length); return m; };
    let m;

    // intenção
    if (cut(R(`${B}(?:e\\s+)?n[ãa]o\\s+(?:posso\\s+|pode\\s+|deixa(?:r)?\\s+(?:eu\\s+)?|quero\\s+)?esquecer(?:\\s+de)?${E}`))) o.mustNotForget = true;
    if (cut(R(`^\\s*(?:me\\s+)?(?:lembr[ae]r?|lembre)(?:-me|\\s+me)?(?:\\s+(?:de|que))?${E}`))) o.intent = true;
    else if (cut(R(`^\\s*lembrete:?${E}`))) o.intent = true;

    // lembrete com antecedência: "30 minutos antes"
    if ((m = cut(R(`,?\\s*${B}(?:com\\s+)?(?:lembrete\\s+)?${NUM}\\s*(min(?:utos?)?|h(?:oras?)?|dias?)\\s+antes${E}`)))) {
      const n = num(m[1]), u = m[2][0].toLowerCase(); o.reminder = Math.round(u === 'm' ? n : u === 'h' ? n * 60 : n * 1440);
    }
    // duração com palavra-chave: "leva aproximadamente 1 hora", "por 30 min"
    if ((m = cut(R(`,?\\s*${B}(?:que\\s+)?(?:leva(?:r|ndo)?|dura(?:r|ndo)?|dura[çc][ãa]o(?:\\s+de)?|durante|por)\\s+(?:(?:aproximadamente|cerca\\s+de|uns|umas|mais\\s+ou\\s+menos|em\\s+torno\\s+de|quase)\\s+)?${NUM}\\s*(h(?:oras?|rs?)?|min(?:utos?)?)(?:\\s*(?:e\\s*)?(\\d{1,2})\\s*(?:min(?:utos?)?)?)?(\\s+e\\s+meia)?${E}`)))) {
      o.duration = durOf(m[1], m[2], m[3], m[4]);
    } else if ((m = cut(R(`,?\\s*${B}(?:aproximadamente|cerca\\s+de|mais\\s+ou\\s+menos)\\s+${NUM}\\s*(h(?:oras?|rs?)?|min(?:utos?)?)(?:\\s*(?:e\\s*)?(\\d{1,2})\\s*(?:min(?:utos?)?)?)?(\\s+e\\s+meia)?${E}`)))) {
      o.duration = durOf(m[1], m[2], m[3], m[4]);
    }

    // recorrência
    if (cut(R(`${B}(?:todos\\s+os\\s+|nos\\s+|em\\s+)?dias\\s+[úu]teis${E}`))) o.recurrence = { freq: 'weekdays', days: [1, 2, 3, 4, 5] };
    else if ((m = cut(R(`${B}tod[ao]s?\\s+(?:as\\s+|os\\s+)?((?:${DAYRX})(?:\\s*(?:,|e)\\s*${DAYRX})*)${E}`)))) {
      const days = [...new Set([...m[1].matchAll(R(DAYRX, 'giu'))].map(x => dayIdx(x[0])))].sort();
      o.recurrence = { freq: 'weekdays', days };
    }
    else if ((m = cut(R(`${B}tod[oa]s?\\s+(?:os\\s+)?dias?\\s+(\\d{1,2})(?:\\s+de\\s+cada\\s+m[êe]s)?${E}`)))) o.recurrence = { freq: 'monthly', monthDay: Math.min(31, +m[1]) };
    else if (cut(R(`${B}(?:todos\\s+os\\s+dias|todo\\s+dia|diariamente)${E}`))) o.recurrence = { freq: 'daily', interval: 1 };
    else if ((m = cut(R(`${B}a\\s+cada\\s+(\\d+)\\s+dias${E}`)))) o.recurrence = { freq: 'interval', interval: Math.max(2, +m[1]) };
    else if (cut(R(`${B}dia\\s+sim,?\\s+dia\\s+n[ãa]o${E}`))) o.recurrence = { freq: 'interval', interval: 2 };
    else if (cut(R(`${B}(?:toda\\s+semana|semanalmente|todas\\s+as\\s+semanas)${E}`))) o.recurrence = { freq: 'weekly', interval: 1 };
    else if (cut(R(`${B}(?:todo\\s+m[êe]s|mensalmente|todos\\s+os\\s+meses)${E}`))) o.recurrence = { freq: 'monthly' };
    else if (cut(R(`${B}(?:todo\\s+ano|anualmente|todos\\s+os\\s+anos)${E}`))) o.recurrence = { freq: 'yearly' };

    // data
    const PREP = '(?:(?:na|no|nesta|neste|nessa|nesse|para|pra|at[ée]|em)\\s+)?';
    if (cut(R(`${B}${PREP}depois\\s+de\\s+amanh[ãa]${E}`))) o.date = addDays(T, 2);
    else if (cut(R(`${B}${PREP}amanh[ãa]${E}`))) o.date = addDays(T, 1);
    else if (cut(R(`${B}${PREP}hoje${E}`))) o.date = T;
    else if ((m = cut(R(`${B}${PREP}(pr[óo]xim[ao]\\s+)?(segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo)(?:-feira)?(\\s+que\\s+vem)?${E}`)))) {
      let delta = (dayIdx(m[2]) - now.getDay() + 7) % 7; if (delta === 0 && (m[1] || m[3])) delta = 7; o.date = addDays(T, delta);
    }
    else if ((m = cut(R(`${B}${PREP}(?:(?:o\\s+)?dia\\s+)?(\\d{1,2})/(\\d{1,2})(?:/(\\d{2,4}))?${E}`)))) {
      let y = m[3] ? +m[3] : now.getFullYear(); if (y < 100) y += 2000;
      let d = new Date(y, +m[2] - 1, +m[1]); if (!m[3] && ymd(d) < T) d = new Date(y + 1, +m[2] - 1, +m[1]); o.date = ymd(d);
    }
    else if ((m = cut(R(`${B}${PREP}(?:dia\\s+)?(\\d{1,2})\\s+de\\s+${MONRX}(?:\\s+de\\s+(\\d{4}))?${E}`)))) {
      const y = m[3] ? +m[3] : now.getFullYear(); let d = new Date(y, monIdx(m[2]), +m[1]); if (!m[3] && ymd(d) < T) d = new Date(y + 1, monIdx(m[2]), +m[1]); o.date = ymd(d);
    }
    else if ((m = cut(R(`${B}${PREP}(?:o\\s+)?dia\\s+(\\d{1,2})${E}`)))) {
      const n = +m[1]; let d = new Date(now.getFullYear(), now.getMonth(), n); if (ymd(d) < T) d = new Date(now.getFullYear(), now.getMonth() + 1, n); o.date = ymd(d);
    }
    else if (cut(R(`${B}${PREP}(?:pr[óo]xima\\s+semana|semana\\s+que\\s+vem)${E}`))) o.date = addDays(weekStart(T), 7);
    else if (cut(R(`${B}${PREP}(?:o\\s+)?fim\\s+de\\s+semana${E}`))) o.date = addDays(T, (6 - now.getDay() + 7) % 7);
    else if (cut(R(`${B}${PREP}(?:m[êe]s\\s+que\\s+vem|pr[óo]ximo\\s+m[êe]s)${E}`))) o.date = ymd(new Date(now.getFullYear(), now.getMonth() + 1, 1));

    // horário
    let h = null, mi = 0, per = null;
    if ((m = cut(R(`${B}(?:(?:[àa]s?|pelas?|por\\s+volta\\s+das?|a\\s+partir\\s+das?|at[ée]\\s+[àa]s)\\s+)(\\d{1,2})(?:[:h](\\d{2}))?\\s*(?:h(?:oras?|rs?)?|hs)?(\\s+e\\s+meia)?${PER}${E}`)))) { h = +m[1]; mi = m[2] ? +m[2] : (m[3] ? 30 : 0); per = m[4]; }
    else if ((m = cut(R(`${B}(?:[àa]s?|pelas?|por\\s+volta\\s+das?)\\s+${HOURW}(?:\\s+e\\s+(meia|quinze|trinta|quarenta|vinte|dez|cinco|cinquenta))?(?:\\s+horas?)?${PER}${E}`)))) { h = num(m[1]); mi = m[2] ? (m[2].toLowerCase() === 'meia' ? 30 : num(m[2])) : 0; per = m[3]; }
    else if ((m = cut(R(`${B}(?:ao\\s+|[àa]o?\\s+)?meio[-\\s]dia(\\s+e\\s+meia)?${E}`)))) { h = 12; mi = m[1] ? 30 : 0; }
    else if (cut(R(`${B}(?:[àa]\\s+)?meia[-\\s]noite${E}`))) { h = 0; }
    else if ((m = cut(R(`${B}(\\d{1,2}):(\\d{2})${PER}${E}`)))) { h = +m[1]; mi = +m[2]; per = m[3]; }
    else if ((m = cut(R(`${B}(\\d{1,2})h(\\d{2})?${PER}${E}`)))) { h = +m[1]; mi = m[2] ? +m[2] : 0; per = m[3]; }
    if (h == null && (m = cut(R(`${B}(?:de|pela|[àa]|na|no\\s+fim\\s+da)\\s+(manh[ãa]|tarde|noite)${E}`)))) {
      const p = m[1].toLowerCase(); h = p.startsWith('manh') ? 9 : p === 'tarde' ? 14 : 19; mi = 0;
    }
    if (h != null) {
      if (per) { const p = per.toLowerCase(); if ((p === 'tarde' || p === 'noite') && h < 12) h += 12; }
      if (h < 24 && mi < 60) o.time = `${pad(h)}:${pad(mi)}`;
    }

    // duração sem palavra-chave: "1 hora", "meia hora", "45 minutos"
    if (o.duration == null) {
      if (cut(R(`,?\\s*${B}(?:de\\s+)?meia\\s+hora${E}`))) o.duration = 30;
      else if ((m = cut(R(`,?\\s*${B}${NUM}\\s*(horas?|minutos?|min)(?:\\s+e\\s+(\\d{1,2})\\s*min(?:utos?)?)?(\\s+e\\s+meia)?${E}`)))) o.duration = durOf(m[1], m[2], m[3], m[4]);
    }

    // prioridade
    if (cut(R(`${B}(?:[ée]\\s+)?(?:urgente|muito\\s+importante|prioridade\\s+(?:m[áa]xima|alta))${E}`))) o.priority = 1;
    else if (cut(R(`,?\\s*${B}(?:[ée]\\s+)?importante${E}`))) o.priority = 1;
    if (/!!\s*$/.test(s)) { s = s.replace(/!!\s*$/, ' '); o.priority = 1; }

    // tipo
    if (R(`${B}(reuni[ãa]o|consulta|compromisso|entrevista|dentista|m[ée]dic[oa]|call|encontro|anivers[áa]rio|almo[çc]o\\s+com|jantar\\s+com|visita|exame|audi[êe]ncia)${E}`).test(s)) o.type = 'event';

    // título
    let t = s.replace(/\s+/g, ' ').trim(), prev;
    do {
      prev = t;
      t = t.replace(/^(?:de|que|para|pra|e|a|o|,|-|–|:)\s+/i, '').replace(/^[,;:–-]+\s*/, '')
        .replace(/[\s,;:–-]+$/, '').replace(R(`\\s+(?:de|para|pra|às|as|no|na|em|e|que|por|com)$`), '');
    } while (t !== prev);
    if (/\.$/.test(t) && !/(?:Dra?|Sra?|Prof|Profa|etc|Ltda)\.$/i.test(t)) t = t.replace(/\.+$/, '');
    o.title = cap(t.trim());

    // completar datas implícitas
    if (!o.date && o.recurrence) o.date = firstOccurrence(o.recurrence, T, now);
    if (!o.date && o.time) o.date = toMin(o.time) > now.getHours() * 60 + now.getMinutes() ? T : addDays(T, 1);
    return o;
  }

  function durOf(n, unit, extraMin, meia) {
    const v = num(n) || 0; const u = (unit || '').toLowerCase();
    let mins = u.startsWith('h') ? v * 60 : v; if (extraMin) mins += +extraMin; if (meia) mins += 30;
    return Math.max(5, Math.round(mins));
  }
  function firstOccurrence(r, T, now) {
    if (r.freq === 'weekdays' && r.days && r.days.length) { for (let k = 0; k < 7; k++) { const d = addDays(T, k); if (r.days.includes(parseYmd(d).getDay())) return d; } }
    if (r.freq === 'monthly' && r.monthDay) { let d = new Date(now.getFullYear(), now.getMonth(), Math.min(r.monthDay, lastDayOfMonth(now.getFullYear(), now.getMonth()))); if (ymd(d) < T) d = new Date(now.getFullYear(), now.getMonth() + 1, Math.min(r.monthDay, lastDayOfMonth(now.getFullYear(), now.getMonth() + 1))); return ymd(d); }
    return T;
  }
  return { parse, firstOccurrence };
})();

/* ---------- Sched: disponibilidade, organizador e encaixes ---------- */
const Sched = {
  window(date) {
    const u = Store.state.user; let start = toMin(u.dayStart), end = toMin(u.dayEnd);
    if (end <= start) end = Math.min(1439, start + 600);
    const T = todayStr();
    if (date === T) start = Math.max(start, Math.ceil(nowMin() / 5) * 5);
    else if (date < T) start = end;
    return { start: Math.min(start, end), end, full: { start: toMin(u.dayStart), end } };
  },
  breaks() {
    const l = Store.state.settings.lunch;
    return l.on ? [{ start: toMin(l.start), end: toMin(l.end), label: 'Almoço', kind: 'break' }] : [];
  },
  blocksOf(insts, skipKey) {
    return insts.filter(i => i.time && !i.done && i.key !== skipKey && i.t.type !== 'reminder')
      .map(i => ({ start: toMin(i.time), end: toMin(i.time) + i.dur, inst: i, kind: i.t.type === 'event' ? 'event' : 'task' }));
  },
  gaps(win, blocks) {
    const bs = blocks.map(b => ({ s: Math.max(b.start, win.start), e: Math.min(b.end, win.end) })).filter(b => b.e > b.s).sort((a, b) => a.s - b.s);
    const out = []; let cur = win.start;
    for (const b of bs) { if (b.s > cur) out.push({ start: cur, end: b.s }); cur = Math.max(cur, b.e); }
    if (win.end > cur) out.push({ start: cur, end: win.end });
    return out;
  },
  stats(date) {
    const insts = Tasks.on(date);
    const tasks = insts.filter(i => i.t.type !== 'event');
    const events = insts.filter(i => i.t.type === 'event');
    const pend = tasks.filter(i => !i.done);
    const win = this.window(date);
    const fixedBusy = [...this.breaks(), ...this.blocksOf(events)];
    const available = this.gaps(win, fixedBusy).reduce((a, g) => a + g.end - g.start, 0);
    const planned = pend.reduce((a, i) => a + i.dur, 0);
    const ratio = available > 0 ? planned / available : (planned > 0 ? Infinity : 0);
    const level = ratio <= 0.85 ? 'ok' : ratio <= 1 ? 'full' : 'over';
    return { insts, tasks, events, pend, done: tasks.filter(i => i.done), planned, available, level, ratio, win };
  },
  /* Organizar meu dia: mantém o que tem horário, encaixa o resto por prioridade */
  plan(date) {
    const T = todayStr(), insts = Tasks.on(date), win = this.window(date), buf = Store.state.settings.buffer || 0;
    const stale = date === T ? insts.filter(i => !i.done && i.t.type === 'task' && i.time && toMin(i.time) + i.dur <= win.start) : [];
    const fixed = [...this.breaks(), ...this.blocksOf(insts).filter(b => !stale.includes(b.inst))];
    const over = date === T ? Tasks.overdue() : [];
    const flex = [...insts.filter(i => !i.done && i.t.type === 'task' && !i.time), ...stale, ...over]
      .sort((a, b) => a.t.priority - b.t.priority || b.dur - a.dur);
    const gaps = this.gaps(win, fixed), placed = [], overflow = [];
    for (const i of flex) {
      const g = gaps.find(g => g.end - g.start >= i.dur);
      if (!g) { overflow.push(i); continue; }
      placed.push({ inst: i, start: g.start }); g.start = Math.min(g.end, g.start + i.dur + buf);
    }
    const timeline = [
      ...fixed.filter(b => b.end > win.start || b.kind !== 'break').map(b => ({ ...b, fixed: true })),
      ...placed.map(p => ({ start: p.start, end: p.start + p.inst.dur, inst: p.inst, kind: 'task', fixed: false })),
    ].sort((a, b) => a.start - b.start);
    const fixedTaskMin = fixed.filter(b => b.kind === 'task').reduce((a, b) => a + b.end - b.start, 0);
    const need = flex.reduce((a, i) => a + i.dur, 0) + fixedTaskMin;
    const avail = this.gaps(win, [...this.breaks(), ...this.blocksOf(insts.filter(i => i.t.type === 'event'))]).reduce((a, g) => a + g.end - g.start, 0);
    return { date, timeline, placed, overflow, moves: this.spill(overflow, date), need, avail, win };
  },
  /* manda excedentes (menor prioridade) para os próximos dias com espaço — nunca exclui */
  spill(list, fromDate) {
    const capMap = {}, capOf = d => { if (!(d in capMap)) { const s = this.stats(d); capMap[d] = s.available - s.planned; } return capMap[d]; };
    return [...list].sort((a, b) => b.t.priority - a.t.priority).map(i => {
      for (let k = 1; k <= 21; k++) { const d = addDays(fromDate, k); if (capOf(d) >= i.dur) { capMap[d] -= i.dur; return { inst: i, date: d }; } }
      return { inst: i, date: addDays(fromDate, 1) };
    });
  },
  applyPlan(p, moveOverflow = true) {
    Store.commit(s => {
      for (const pl of p.placed) Tasks._move(s, pl.inst.key, p.date, fromMin(pl.start));
      if (moveOverflow) for (const mv of p.moves) Tasks._move(s, mv.inst.key, mv.date, null, true);
    });
  },
  /* próximo espaço livre para uma tarefa (adiar inteligente) */
  findSlot(inst, fromDate, minStart) {
    for (let k = 0; k <= 30; k++) {
      const d = addDays(fromDate, k), insts = Tasks.on(d), win = this.window(d);
      if (k === 0 && minStart) win.start = Math.max(win.start, minStart);
      const st = this.stats(d), plannedOthers = st.planned - (insts.some(i => i.key === inst.key && !i.done) ? inst.dur : 0);
      if (st.available - plannedOthers < inst.dur) continue;
      const g = this.gaps(win, [...this.breaks(), ...this.blocksOf(insts, inst.key)]).find(g => g.end - g.start >= inst.dur);
      if (g) return { date: d, time: fromMin(g.start) };
    }
    return { date: addDays(fromDate, 1), time: null };
  },
  /* sugerir dias para tarefas sem prazo dentro dos próximos 7 dias */
  suggestUndated() {
    const T = todayStr(), capMap = {};
    const days = weekDays(T).map(d => d); days.forEach(d => { const s = this.stats(d); capMap[d] = s.available - s.planned; });
    return Tasks.undated().sort((a, b) => a.t.priority - b.t.priority).map(i => {
      const best = days.filter(d => capMap[d] >= i.dur).sort((a, b) => capMap[b] - capMap[a] || a.localeCompare(b))[0];
      if (!best) return null; capMap[best] -= i.dur; return { inst: i, date: best };
    }).filter(Boolean);
  },
  /* rolar tarefas pendentes de um dia para frente */
  rollover(date) {
    const pend = this.stats(date).pend.concat(date === todayStr() ? Tasks.overdue() : []);
    return this.spill(pend, date);
  },
};

/* ---------- Hints: ajuda sem interromper (no máximo uma por vez) ---------- */
const Hints = {
  forToday() {
    const T = todayStr(), s = Store.state, st = Sched.stats(T), dis = id => s.dismissed[id + '|' + T];
    const over = Tasks.overdue().length + st.pend.filter(i => Tasks.isOverdue(i)).length;
    if (st.level === 'over' && st.planned > 0 && !dis('over')) {
      const msg = st.available <= 0
        ? `Seu horário de hoje já terminou e ainda restam ${fmtDur(st.planned)} de tarefas.`
        : `Você tem ${fmtDur(st.available)} disponíveis, mas planejou ${fmtDur(st.planned)}. Seu dia está sobrecarregado.`;
      return { id: 'over', cls: 'over', msg, acts: [['organize', 'Organizar automaticamente', 'primary']] };
    }
    if (over > 0 && !dis('late')) return { id: 'late', msg: over === 1 ? 'Uma tarefa ficou atrasada. Quer remarcar ou reorganizar seu dia?' : `${over} tarefas ficaram atrasadas. Quer remarcar ou reorganizar seu dia?`, acts: [['organize', 'Reorganizar meu dia', 'primary'], ['goto-late', 'Ver atrasadas', '']] };
    const createdToday = s.tasks.filter(t => t.date === T && ymd(new Date(t.createdAt)) === T).length;
    if (createdToday >= 5 && !dis('many')) return { id: 'many', msg: 'Você adicionou bastante coisa para hoje. Quer que eu organize?', acts: [['organize', 'Organizar meu dia', 'primary']] };
    const nextEv = st.events.filter(i => !i.done && i.time && toMin(i.time) > nowMin()).sort(Tasks.cmp)[0];
    if (nextEv && !dis('gap')) {
      const busyBefore = Sched.blocksOf(st.insts).filter(b => b.end <= toMin(nextEv.time) && b.end > nowMin());
      const from = Math.max(nowMin(), Sched.window(T).start, ...busyBefore.map(b => b.end));
      const free = toMin(nextEv.time) - from;
      const short = st.pend.filter(i => !i.time && i.dur <= free && i.dur <= 45).sort((a, b) => a.t.priority - b.t.priority)[0];
      if (free >= 20 && short) return { id: 'gap', msg: `Você tem ${fmtDur(free)} livres antes de “${nextEv.t.title}”. Quer encaixar “${short.t.title}”?`, acts: [['fit', 'Encaixar agora', 'primary', short.key, fromMin(from)]] };
    }
    const und = Tasks.undated().length;
    if (und > 0 && !dis('undated')) return { id: 'undated', msg: und === 1 ? 'Você tem uma tarefa sem prazo. Quer que eu sugira quando encaixá-la?' : `Você tem ${und} tarefas sem prazo. Quer que eu sugira quando encaixá-las?`, acts: [['suggest-undated', 'Sugerir dias', 'primary']] };
    return null;
  },
};

/* ---------- Speech: voz (Web Speech API) com fallback ---------- */
const Speech = {
  supported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  rec: null,
  start(onText, onEnd) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { onEnd && onEnd('unsupported'); return; }
    try {
      const r = new SR(); this.rec = r; r.lang = 'pt-BR'; r.interimResults = true; r.continuous = false;
      r.onresult = e => { const txt = [...e.results].map(x => x[0].transcript).join(' '); onText(txt, e.results[e.results.length - 1].isFinal); };
      r.onerror = e => { onEnd && onEnd(e.error || 'error'); };
      r.onend = () => { this.rec = null; onEnd && onEnd(null); };
      r.start();
    } catch (e) { onEnd && onEnd('error'); }
  },
  stop() { try { this.rec && this.rec.stop(); } catch (e) { } },
};
/* ---- notify.js ---- */
/* =====================================================================
   NOVA — notificações
   Motor (Notify.tick) decide O QUE avisar; canais decidem COMO entregar.
   Canais atuais: InApp (sempre) e Browser (Notification API, se permitido).
   Para push real com app fechado: adicionar canal "Push" (Service Worker +
   Web Push / FCM) que recebe o mesmo objeto de mensagem — o motor não muda.
   ===================================================================== */
const InApp = {
  show(msg, f) {
    const box = $('#toasts'); if (!box) return;
    const el = document.createElement('div');
    el.className = 'toast' + (msg.persistent ? ' persist' : '');
    el.setAttribute('role', 'status');
    el.innerHTML = `<b>${esc(msg.title)}</b>${msg.body ? `<p>${esc(msg.body)}</p>` : ''}
      <div class="acts">${(msg.actions || []).map(a => `<button class="btn sm ${a[2] || ''}" data-act="nt" data-op="${a[0]}" data-key="${esc(f.inst ? f.inst.key : '')}">${esc(a[1])}</button>`).join('')}
      <button class="btn sm ghost" data-act="nt" data-op="dismiss">Fechar</button></div>`;
    box.appendChild(el);
    while (box.children.length > 4) box.firstElementChild.remove();
    if (!msg.persistent) setTimeout(() => el.remove(), 14000);
  },
};
const BrowserChannel = {
  supported: () => 'Notification' in window,
  permission: () => ('Notification' in window ? Notification.permission : 'unsupported'),
  async request() { try { return await Notification.requestPermission(); } catch (e) { return 'denied'; } },
  show(msg, f) {
    if (!Store.state.settings.notif.browser || this.permission() !== 'granted') return;
    try { const n = new Notification(msg.title, { body: msg.body || '', tag: f.key, requireInteraction: !!msg.persistent }); n.onclick = () => { window.focus(); n.close(); }; } catch (e) { }
  },
};

const Notify = {
  timer: null,
  start() {
    this.tick(); clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.tick(); });
  },
  allowedNow() {
    const n = Store.state.settings.notif; if (!n.enabled) return false;
    const m = nowMin(), a = toMin(n.startAt), b = toMin(n.quietStart);
    return a < b ? (m >= a && m < b) : (m >= a || m < b);
  },
  collect(now = Date.now()) {
    const s = Store.state, n = s.settings.notif, T = todayStr(), log = s.notifLog, out = [], nm = nowMin();
    const seen = new Set();
    for (const d of [T, addDays(T, 1)]) for (const i of Tasks.on(d)) {
      if (i.done || !i.time || i.t.reminder == null) continue;
      const at = dt(d, i.time) - i.t.reminder * 60000, key = `r|${i.key}|${i.time}|${i.t.reminder}`;
      if (now >= at && now - at < 3 * 3600e3 && !log[key]) { out.push({ key, kind: 'reminder', inst: i }); seen.add(i.key); }
    }
    if (n.overdue) for (const i of Tasks.on(T)) {
      if (i.done || !i.time || i.t.type !== 'task' || seen.has(i.key)) continue;
      const end = dt(T, i.time) + Math.max(i.dur, 15) * 60000, key = `o|${i.key}|${i.time}`;
      if (now > end && now - end < 6 * 3600e3 && !log[key]) { out.push({ key, kind: 'overdue', inst: i }); seen.add(i.key); }
    }
    for (const i of [...Tasks.on(T), ...Tasks.overdue()]) {
      if (i.done || !i.t.persistent || seen.has(i.key) || i.t.type === 'event') continue;
      const due = i.time ? dt(i.date, i.time) : (i.date < T ? 0 : null);
      if (due == null || now < due || now < (i.t.snoozeUntil || 0)) continue;
      const key = `p|${i.key}|${Math.floor(now / 1800000)}`;
      if (!log[key]) out.push({ key, kind: 'persistent', inst: i });
    }
    const inWin = (t, span = 180) => nm >= toMin(t) && nm < toMin(t) + span;
    if (n.daily && inWin(n.dailyAt) && !log['d|' + T]) out.push({ key: 'd|' + T, kind: 'daily' });
    if (n.review && inWin(s.user.dayEnd) && !log['v|' + T]) { const c = Sched.stats(T).pend.length; out.push({ key: 'v|' + T, kind: 'review', count: c, silent: c === 0 }); }
    if (n.weekly && new Date().getDay() === 0 && inWin('18:00') && !log['w|' + T]) out.push({ key: 'w|' + T, kind: 'weekly' });
    return out;
  },
  tick() {
    const s = Store.state; if (!s.user.onboarded || !this.allowedNow()) return;
    const fire = this.collect(); if (!fire.length) return;
    fire.forEach(f => { s.notifLog[f.key] = Date.now(); });
    const keys = Object.keys(s.notifLog); if (keys.length > 400) keys.sort((a, b) => s.notifLog[a] - s.notifLog[b]).slice(0, keys.length - 300).forEach(k => delete s.notifLog[k]);
    Store.save();
    fire.filter(f => !f.silent).forEach(f => this.deliver(f));
  },
  compose(f) {
    const i = f.inst, t = i && i.t;
    switch (f.kind) {
      case 'reminder': {
        const mins = Math.round((dt(i.date, i.time) - Date.now()) / 60000);
        const when = mins <= 1 ? 'Agora' : mins < 60 ? `Daqui a ${mins} minutos` : mins < 1440 ? `Daqui a ${fmtDur(mins)}` : `Amanhã às ${i.time}`;
        return { title: `🔔 ${when}: ${t.title}`, body: i.time ? `${relDay(i.date)} às ${i.time}` : '', actions: t.type === 'event' ? [['open', 'Abrir']] : [['done', 'Concluir', 'primary'], ['snooze', 'Adiar 30 min'], ['open', 'Abrir']] };
      }
      case 'overdue': return { title: '⚠️ Essa tarefa ainda não foi concluída.', body: t.title, actions: [['done', 'Concluir', 'primary'], ['postpone', 'Adiar…'], ['open', 'Abrir']] };
      case 'persistent': return { title: 'Você ainda não concluiu esta tarefa.', body: t.title, persistent: true, actions: [['done', 'Concluir', 'primary'], ['snooze', 'Adiar 30 min'], ['pick', 'Escolher outro horário']] };
      case 'daily': { const st = Sched.stats(todayStr()); return { title: '☀️ Bom dia! Aqui está seu plano para hoje.', body: `${st.pend.length} tarefas e ${st.events.length} compromissos.`, actions: [['today', 'Ver meu dia', 'primary'], ['organize', 'Organizar']] }; }
      case 'review': return { title: `Seu dia terminou. Você tem ${f.count} ${f.count === 1 ? 'tarefa pendente' : 'tarefas pendentes'}.`, body: 'Quer passar para os próximos dias?', actions: [['rollover', 'Reorganizar', 'primary']] };
      case 'weekly': return { title: 'É hora de organizar sua próxima semana.', body: 'Leva poucos minutos no Planner.', actions: [['planner', 'Abrir Planner', 'primary']] };
    }
    return { title: 'NOVA' };
  },
  deliver(f) { const msg = this.compose(f); InApp.show(msg, f); BrowserChannel.show(msg, f); },
  test() { this.deliver({ key: 'test|' + Date.now(), kind: 'daily' }); },
};

const C = {
  projChip(t) { const p = Tasks.project(t.projectId); return p ? `<span class="pchip"><i style="background:${esc(p.color)}"></i>${esc(p.name)}</span>` : ''; },
  meta(i, o = {}) {
    const t = i.t, out = [];
    if (o.showDate && i.date) out.push(`<span>${relDay(i.date)}</span>`);
    if (i.time) out.push(`<span class="t">${i.time}${i.dur ? '–' + fromMin(toMin(i.time) + i.dur) : ''}</span>`);
    else if (i.dur) out.push(`<span>${fmtDur(i.dur)}</span>`);
    if (t.priority <= 2 && !i.done) out.push(`<span class="prio-flag p${t.priority}">${PRIORITIES[t.priority]}</span>`);
    if (Tasks.isOverdue(i)) out.push('<span class="over">Atrasada</span>');
    else if (t.status === 'postponed' && !i.done) out.push('<span class="post">Adiada</span>');
    const pc = this.projChip(t); if (pc) out.push(pc);
    (t.tags || []).forEach(g => out.push(`<span>#${esc(g)}</span>`));
    if (t.subtasks && t.subtasks.length) out.push(`<span class="ico">${icon('check', 13)}${t.subtasks.filter(x => x.done).length}/${t.subtasks.length}</span>`);
    if (t.recurrence || t.fromSeries) out.push(`<span class="ico" title="Recorrente">${icon('repeat', 13)}</span>`);
    if (t.reminder != null) out.push(`<span class="ico" title="${esc(reminderLabel(t.reminder))}">${icon('bell', 13)}</span>`);
    if (t.attachments && t.attachments.length) out.push(`<span class="ico">${icon('clip', 13)}${t.attachments.length}</span>`);
    return out.join('');
  },
  row(i, o = {}) {
    const t = i.t;
    const lead = t.type === 'event'
      ? `<span class="kind-ic" title="Compromisso">${icon('event', 14)}</span>`
      : t.type === 'reminder' && !i.done
        ? `<button class="kind-ic reminder" data-act="toggle" data-key="${i.key}" title="Lembrete — marcar como visto">${icon('bell', 14)}</button>`
        : `<button class="check" data-act="toggle" data-key="${i.key}" aria-label="${i.done ? 'Reabrir' : 'Concluir'} ${esc(t.title)}">${icon('check', 14)}</button>`;
    return `<div class="trow p${t.priority}${i.done ? ' done' : ''}" data-key="${i.key}" ${o.drag ? 'draggable="true"' : ''}>
      ${lead}
      <button class="tmain" data-act="edit" data-key="${i.key}"><div class="ttitle">${esc(t.title)}</div><div class="tmeta">${this.meta(i, o)}</div></button>
      <button class="tmore" data-act="menu" data-key="${i.key}" aria-label="Opções">${icon('more', 18)}</button>
    </div>`;
  },
  list(insts, o = {}) { return insts.length ? `<div class="list${o.flat ? ' flat' : ''}">${insts.map(i => this.row(i, o)).join('')}</div>` : (o.empty ? `<div class="empty">${o.empty}</div>` : ''); },
  pcard(i) {
    const t = i.t;
    return `<div class="pcard p${t.priority}${t.type === 'event' ? ' event' : ''}${i.done ? ' done' : ''}" draggable="true" data-key="${i.key}">
      ${t.type === 'event' ? icon('event', 14) : '<i class="pdot"></i>'}
      <button class="pt" data-act="edit" data-key="${i.key}">${esc(t.title)}<small>${i.time ? i.time + ' · ' : ''}${i.dur ? fmtDur(i.dur) : 'lembrete'}</small></button>
      <button class="tmore" data-act="menu" data-key="${i.key}" aria-label="Mover ou editar">${icon('more', 16)}</button>
    </div>`;
  },
  lvl(level) { return `<span class="lvl ${level}">${{ ok: 'equilibrado', full: 'cheio', over: 'sobrecarregado' }[level]}</span>`; },
  hint(h) {
    if (!h) return '';
    return `<div class="hint ${h.cls || ''}"><p>${esc(h.msg)}</p><div class="acts">${h.acts.map(a => `<button class="btn sm ${a[2] || ''}" data-act="${a[0]}" data-key="${a[3] || ''}" data-time="${a[4] || ''}" data-date="${todayStr()}">${esc(a[1])}</button>`).join('')}<button class="btn sm ghost" data-act="dismiss-hint" data-id="${h.id}">Agora não</button></div></div>`;
  },
};

    const overdue = Tasks.overdue(), done = st.insts.filter(i => i.done);
    const df = s.tasks.filter(t => t.mustNotForget && t.status !== 'done' && !t.recurrence).concat(s.tasks.filter(t => t.mustNotForget && t.recurrence)).slice(0, 8);
    const full = st.win.full, span = Math.max(60, full.end - full.start), pct = m => Math.max(0, Math.min(100, (m - full.start) / span * 100));
    const blocks = [...Sched.breaks().map(b => ({ ...b })), ...st.insts.filter(i => i.time && i.dur).map(i => ({ start: toMin(i.time), end: toMin(i.time) + i.dur, kind: i.t.type === 'event' ? 'event' : 'task', done: i.done, title: i.t.title }))];

      <section class="block"><h2>Na agenda <span class="muted">${timed.length || ''}</span></h2>

    let h1 = Math.ceil(Math.max(toMin(u.dayEnd), ...timed.map(i => toMin(i.time) + Math.max(i.dur, 15))) / 60);
    h0 = Math.max(0, h0 - 1); h1 = Math.min(24, h1 + 1);
    const HH = 52, cols = `56px repeat(${days.length},minmax(0,1fr))`;
    const head = `<div class="tg-head" style="grid-template-columns:${cols}"><div></div>${days.map(d => { const o = parseYmd(d); return `<div class="${d === T ? 'today' : ''}">${DOW_S[o.getDay()]}<b>${o.getDate()}</b></div>`; }).join('')}</div>`;
    const allday = `<div class="tg-allday" style="grid-template-columns:${cols}"><div class="muted" style="font-size:11px;text-align:right;padding:6px">sem hora</div>${all.map(list => `<div>${list.filter(i => !i.time).map(i => `<button class="mev${i.done ? ' done' : ''}" style="border:0;text-align:left" data-act="edit" data-key="${i.key}">${esc(i.t.title)}</button>`).join('')}</div>`).join('')}</div>`;

      const items = all[ci].filter(i => i.time).map(i => ({ i, s: toMin(i.time), e: toMin(i.time) + Math.max(i.dur, 20) })).sort((a, b) => a.s - b.s);
      const lanes = []; items.forEach(it => { let l = lanes.findIndex(end => end <= it.s); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = it.e; it.l = l; });
      const n = Math.max(1, lanes.length);

      const now = d === T && nowMin() >= h0 * 60 && nowMin() <= h1 * 60 ? `<div class="tg-now" style="top:${(nowMin() - h0 * 60) * HH / 60}px"></div>` : '';

  /* ---------------- TAREFAS ---------------- */
  tasks() {
    const p = App.params.tasks, T = todayStr(), s = Store.state;
    const F = [['today', 'Hoje'], ['tomorrow', 'Amanhã'], ['week', 'Semana'], ['late', 'Atrasadas'], ['important', 'Importantes'], ['undated', 'Sem data'], ['all', 'Todas'], ['done', 'Concluídas']];
    let items = [];
    const horizon = Tasks.range(addDays(T, -30), addDays(T, 60));
    const singles = s.tasks.filter(t => !t.recurrence);
    const pool = () => [...horizon.filter(i => i.rec && i.date >= T && i.date <= addDays(T, 14)), ...singles.map(t => Tasks.inst(t, t.date))];
    switch (p.filter) {
      case 'today': items = Tasks.on(T).concat(Tasks.overdue()); break;
      case 'tomorrow': items = Tasks.on(addDays(T, 1)); break;
      case 'week': items = Tasks.range(T, addDays(weekStart(T), 6)); break;
      case 'late': items = Tasks.overdue().concat(Tasks.on(T).filter(i => Tasks.isOverdue(i))); break;
      case 'important': items = pool().filter(i => i.t.priority === 1 && !i.done); break;
      case 'undated': items = Tasks.undated(); break;
      case 'done': items = singles.filter(t => t.status === 'done').map(t => Tasks.inst(t, t.date)).sort((a, b) => (b.t.doneAt || 0) - (a.t.doneAt || 0)); break;
      default: items = pool().filter(i => !i.done);
    }
    if (p.project) items = items.filter(i => i.t.projectId === p.project);
    if (p.tag) items = items.filter(i => (i.t.tags || []).includes(p.tag));
    const tags = [...new Set(s.tasks.flatMap(t => t.tags || []))].sort();
    // agrupar por data
    const groups = {}; items.forEach(i => { const k = i.date || 'none'; (groups[k] = groups[k] || []).push(i); });
    const keys = Object.keys(groups).sort((a, b) => a === 'none' ? 1 : b === 'none' ? -1 : (p.filter === 'done' ? b.localeCompare(a) : a.localeCompare(b)));
    keys.forEach(k => groups[k].sort(Tasks.cmp));
    return `<section class="page">
      <h1 class="page-title">Tarefas</h1><p class="page-sub">Tudo que você precisa fazer, em um só lugar.</p>
      <div class="filters" role="group" aria-label="Filtro">${F.map(([k, l]) => `<button class="chip" data-act="task-filter" data-f="${k}" aria-pressed="${p.filter === k}">${l}</button>`).join('')}</div>
      <div class="filters-2">
        <select class="input" data-change="task-project" aria-label="Projeto"><option value="">Todos os projetos</option>${s.projects.map(x => `<option value="${x.id}" ${p.project === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
        ${tags.length ? `<select class="input" data-change="task-tag" aria-label="Etiqueta"><option value="">Todas as etiquetas</option>${tags.map(g => `<option ${p.tag === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>` : ''}
        <button class="btn primary" data-act="capture">${icon('plus', 18)}Nova tarefa</button>
      </div>
      ${keys.length ? keys.map(k => `<h3 class="group-h">${k === 'none' ? 'Sem data' : (relDay(k) === fmtShort(k) ? fmtLong(k) : relDay(k) + ' · ' + fmtShort(k))}</h3>${C.list(groups[k])}`).join('') : `<div class="empty">Nada por aqui.${p.filter === 'late' ? ' Nenhuma tarefa atrasada.' : ''}<br><button class="btn sm" data-act="capture">Adicionar tarefa</button></div>`}
    </section>`;
  },

  /* ---------------- PLANNER ---------------- */
  planner() {
    const ws = App.params.planner.week, days = weekDays(ws), T = todayStr(), und = Tasks.undated();
    const a = parseYmd(ws), b = parseYmd(addDays(ws, 6));
    return `<section class="page wide">
      <div class="toolbar">
        <h1 class="title">Planner · ${a.getDate()} ${MONTHS[a.getMonth()].slice(0, 3)} – ${b.getDate()} ${MONTHS[b.getMonth()].slice(0, 3)}</h1>
        <button class="btn" data-act="suggest-undated">${icon('spark', 18)}Planejar semana</button>
        <button class="btn icon" data-act="planner-nav" data-n="-1" aria-label="Semana anterior">${icon('left')}</button>
        <button class="btn" data-act="planner-nav" data-n="0">Esta semana</button>
        <button class="btn icon" data-act="planner-nav" data-n="1" aria-label="Próxima semana">${icon('right')}</button>
      </div>
      <div class="planner">
        ${days.map(d => {
          const st = Sched.stats(d), o = parseYmd(d), pct = st.available > 0 ? Math.min(100, st.planned / st.available * 100) : (st.planned ? 100 : 0);
          return `<div class="pday${d === T ? ' today' : ''}" data-drop="${d}">
            <div class="pday-h"><div class="dname">${DOW[o.getDay()].split('-')[0]} <span class="muted" style="font-weight:500">${o.getDate()}</span> ${st.planned ? C.lvl(st.level).replace(/>[^<]+</, '><') : ''}</div>
            <small>${st.tasks.length} ${st.tasks.length === 1 ? 'tarefa' : 'tarefas'}${st.events.length ? ' · ' + st.events.length + ' compr.' : ''} · ${fmtDur(st.planned)}</small>
            <div class="pbar ${st.level}"><i style="width:${pct}%"></i></div></div>
            <div class="pitems">${st.insts.map(i => C.pcard(i)).join('')}</div>
            <button class="padd" data-act="capture" data-date="${d}">+ Adicionar</button>
          </div>`;
        }).join('')}
        <aside class="ptray" data-drop="none"><h3>Sem data <span class="muted">${und.length}</span></h3><p>${App.isMobile() ? 'Use “⋯” para mover para um dia.' : 'Arraste para um dia da semana.'}</p><div class="pitems">${und.map(i => C.pcard(i)).join('') || '<p>Nenhuma tarefa sem data.</p>'}</div></aside>
      </div>
    </section>`;
  },

  /* ---------------- PROJETOS ---------------- */
  projects() {
    const s = Store.state, sel = App.params.projects.id;
    if (sel) {
      const p = Tasks.project(sel); if (!p) { App.params.projects.id = null; return this.projects(); }
      const ts = s.tasks.filter(t => t.projectId === p.id), open = ts.filter(t => t.status !== 'done' || t.recurrence), done = ts.filter(t => t.status === 'done' && !t.recurrence);
      const inst = t => Tasks.inst(t, t.recurrence ? Parser.firstOccurrence(t.recurrence, todayStr(), new Date()) : t.date);
      return `<section class="page">
        <button class="btn ghost sm" data-act="project-open" data-id="">${icon('left', 16)}Projetos</button>
        <div class="toolbar" style="margin-top:10px"><h1 class="title" style="display:flex;align-items:center;gap:12px"><i style="width:14px;height:14px;border-radius:4px;background:${esc(p.color)}"></i>${esc(p.name)}</h1>
          <button class="btn" data-act="edit-project" data-id="${p.id}">${icon('edit', 16)}Editar</button>
          <button class="btn primary" data-act="capture" data-project="${p.id}">${icon('plus', 18)}Tarefa</button></div>
        ${C.list(open.map(inst).sort((a, b) => (a.date || '9').localeCompare(b.date || '9')), { showDate: true, empty: 'Nenhuma tarefa aberta neste projeto.' })}

      </section>`;
    }
    const card = p => {
      const ts = s.tasks.filter(t => t.projectId === p.id && !t.recurrence), d = ts.filter(t => t.status === 'done').length, open = s.tasks.filter(t => t.projectId === p.id && (t.status !== 'done'));
      return `<button class="pcard-big" data-act="project-open" data-id="${p.id}"><h3><i style="background:${esc(p.color)}"></i>${esc(p.name)}</h3>
        <span class="muted" style="font-size:13px">${open.length} ${open.length === 1 ? 'aberta' : 'abertas'} · ${d} ${d === 1 ? 'concluída' : 'concluídas'}</span>
        <div class="progress"><i style="width:${ts.length ? d / ts.length * 100 : 0}%"></i></div>
        <ul>${open.slice(0, 3).map(t => `<li>☐ ${esc(t.title)}</li>`).join('') || '<li>Sem tarefas abertas</li>'}</ul></button>`;
    };
    const work = s.projects.filter(p => p.area === 'work'), pers = s.projects.filter(p => p.area !== 'work');
    return `<section class="page">
      <div class="toolbar"><h1 class="title">Projetos</h1><button class="btn primary" data-act="edit-project">${icon('plus', 18)}Novo projeto</button></div>
      <h2 class="area-h">Trabalho</h2>${work.length ? `<div class="grid-cards">${work.map(card).join('')}</div>` : '<div class="empty">Nenhum projeto de trabalho.</div>'}
      <h2 class="area-h">Pessoal</h2>${pers.length ? `<div class="grid-cards">${pers.map(card).join('')}</div>` : '<div class="empty">Nenhum projeto pessoal.</div>'}

  },

    const T = todayStr(), items = Store.state.tasks.filter(t => t.mustNotForget && (t.status !== 'done' || t.recurrence))

  /* ---------------- RESUMO ---------------- */
  summary() {
    const ws = App.params.summary.week, days = weekDays(ws), T = todayStr(), s = Store.state;
    const per = days.map(d => ({ d, st: Sched.stats(d) }));
    const all = per.flatMap(x => x.st.tasks);
    const done = all.filter(i => i.done).length, pend = all.filter(i => !i.done && i.date >= T).length;
    const late = all.filter(i => Tasks.isOverdue(i)).length + (ws <= T && T <= addDays(ws, 6) ? Tasks.overdue().filter(i => i.date < ws).length : 0);
    const hours = per.reduce((a, x) => a + x.st.tasks.reduce((b, i) => b + i.dur, 0), 0);
    const evs = per.reduce((a, x) => a + x.st.events.length, 0);
    const projs = new Set(all.map(i => i.t.projectId).filter(Boolean)).size;
    const maxMin = Math.max(60, ...per.map(x => x.st.tasks.reduce((b, i) => b + i.dur, 0)));
    const busiest = per.slice().sort((a, b) => b.st.tasks.reduce((x, i) => x + i.dur, 0) - a.st.tasks.reduce((x, i) => x + i.dur, 0))[0];
    const busyMin = busiest.st.tasks.reduce((x, i) => x + i.dur, 0);
    const insights = [];
    if (busyMin) insights.push(`Seu dia mais cheio é ${DOW[parseYmd(busiest.d).getDay()]} (${fmtDur(busyMin)} de tarefas).`);
    const overDays = per.filter(x => x.st.level === 'over' && x.d >= T).length;
    if (overDays) insights.push(`${overDays} ${overDays === 1 ? 'dia está sobrecarregado' : 'dias estão sobrecarregados'}. O Planner ajuda a redistribuir.`);
    const postponed = s.tasks.filter(t => (t.postponed || 0) >= 2 && t.status !== 'done');
    if (postponed.length) insights.push(`“${postponed[0].title}” já foi adiada ${postponed[0].postponed} vezes. Vale quebrar em partes menores?`);
    if (all.length && done / all.length >= 0.7) insights.push('Você concluiu a maior parte do que planejou. Bom ritmo.');
    const a = parseYmd(ws), b = parseYmd(addDays(ws, 6));
    return `<section class="page">
      <div class="toolbar"><h1 class="title">Minha semana</h1>
        <button class="btn icon" data-act="summary-nav" data-n="-1" aria-label="Semana anterior">${icon('left')}</button>
        <button class="btn" data-act="summary-nav" data-n="0">${a.getDate()} ${MONTHS[a.getMonth()].slice(0, 3)} – ${b.getDate()} ${MONTHS[b.getMonth()].slice(0, 3)}</button>
        <button class="btn icon" data-act="summary-nav" data-n="1" aria-label="Próxima semana">${icon('right')}</button></div>
      <div class="stats">
        <div class="stat"><b>${done}</b><span>tarefas concluídas</span></div>
        <div class="stat"><b>${pend}</b><span>pendentes</span></div>
        <div class="stat"><b>${late}</b><span>atrasadas</span></div>
        <div class="stat"><b>${fmtDur(hours)}</b><span>planejadas</span></div>
        <div class="stat"><b>${evs}</b><span>compromissos</span></div>
        <div class="stat"><b>${projs}</b><span>projetos ativos</span></div>
      </div>
      <section class="block"><h2>Tempo por dia <span class="muted">cinza: planejado · cor: concluído</span></h2>
        <div class="weekbars">${per.map(x => { const pl = x.st.tasks.reduce((b, i) => b + i.dur, 0), dn = x.st.done.reduce((b, i) => b + i.dur, 0); return `<div class="wb"><div class="bars"><i style="height:${pl / maxMin * 100}%" title="Planejado ${fmtDur(pl)}"></i><i class="d" style="height:${dn / maxMin * 100}%" title="Concluído ${fmtDur(dn)}"></i></div><span>${DOW_S[parseYmd(x.d).getDay()]}</span></div>`; }).join('')}</div>
      </section>
      ${insights.length ? `<section class="block"><h2>Observações</h2>${insights.map(t => `<p class="insight">${esc(t)}</p>`).join('')}</section>` : ''}
    </section>`;
  },

  /* ---------------- CONFIGURAÇÕES ---------------- */
  settings() {

    const tg = (path, val, label, sub) => `<label class="toggle"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><input type="checkbox" class="switch" data-change="set-bool" data-path="${path}" ${val ? 'checked' : ''}></label>`;

      <div class="settings-sec"><h2>Você</h2>

        <div class="row2">${tm('user.dayStart', s.user.dayStart, 'Início do dia')}${tm('user.dayEnd', s.user.dayEnd, 'Fim do dia')}</div>

        <div class="row2" style="margin-top:12px">${tm('settings.lunch.start', s.settings.lunch.start, 'Almoço começa')}${tm('settings.lunch.end', s.settings.lunch.end, 'Almoço termina')}</div>
        <label class="field"><span>Pausa entre tarefas ao organizar</span><select class="input" data-change="set-num" data-path="settings.buffer">${[0, 5, 10, 15, 30].map(v => `<option value="${v}" ${s.settings.buffer === v ? 'selected' : ''}>${v ? v + ' minutos' : 'Sem pausa'}</option>`).join('')}</select></label>
      </div>
      <div class="settings-sec"><h2>Aparência</h2>
        <div class="seg" style="margin:6px 0 4px">${[['auto', 'Automático'], ['light', '☀️ Claro'], ['dark', '🌙 Escuro']].map(([k, l]) => `<button data-act="set-theme" data-v="${k}" aria-pressed="${s.settings.theme === k}">${l}</button>`).join('')}</div>
        <div class="swatches">${Object.entries(ACCENTS).map(([k, [l, c]]) => `<button class="swatch" style="background:${c}" data-act="set-accent" data-v="${k}" aria-pressed="${s.settings.accent === k}" aria-label="Cor ${l}" title="${l}"></button>`).join('')}</div>
      </div>
      <div class="settings-sec"><h2>Notificações</h2>
        ${tg('settings.notif.enabled', n.enabled, 'Notificações ativadas')}
        <label class="toggle"><span>Avisos do navegador<small>${perm === 'granted' ? 'Permitido neste navegador.' : perm === 'denied' ? 'Bloqueado pelo navegador. Libere nas permissões do site.' : perm === 'unsupported' ? 'Este navegador não oferece avisos.' : 'Mostra avisos mesmo com a aba em segundo plano.'}</small></span><input type="checkbox" class="switch" data-change="notif-browser" ${n.browser && perm === 'granted' ? 'checked' : ''} ${perm === 'unsupported' || perm === 'denied' ? 'disabled' : ''}></label>
        <div class="row2" style="margin-top:12px">${tm('settings.notif.startAt', n.startAt, 'Receber a partir de')}${tm('settings.notif.quietStart', n.quietStart, 'Silêncio a partir de')}</div>
        <label class="field"><span>Lembrete padrão</span><select class="input" data-change="set-num" data-path="settings.notif.defaultReminder">${REMINDERS.filter(r => r[0] != null).map(([v, l]) => `<option value="${v}" ${n.defaultReminder === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        ${tg('settings.notif.overdue', n.overdue, 'Avisar tarefas atrasadas')}
        ${tg('settings.notif.daily', n.daily, 'Resumo diário', 'Plano do dia pela manhã.')}
        ${tm('settings.notif.dailyAt', n.dailyAt, 'Horário do resumo diário')}
        ${tg('settings.notif.review', n.review, 'Revisão no fim do dia')}
        ${tg('settings.notif.weekly', n.weekly, 'Planejamento semanal', 'Domingo às 18h.')}
        <div style="padding-top:12px"><button class="btn" data-act="notif-test">${icon('bell', 18)}Testar notificação</button></div>
      </div>
      ${Cloud.user ? `<div class="settings-sec"><h2>Conta</h2>
        <p class="muted" style="margin:6px 0 12px">Conectado como <strong>${esc(Cloud.user.email || '')}</strong>. ${Sync.status === 'cloud' ? 'Tudo sincronizado.' : 'Sem conexão agora: as mudanças ficam neste aparelho e sobem quando a internet voltar.'}</p>
        <div style="padding-bottom:6px"><button class="btn" data-act="logout">Sair da conta</button></div>
      </div>` : ''}
      <div class="settings-sec"><h2>Dados</h2>
        <p class="muted" style="margin:6px 0 12px">Faça uma cópia de segurança de tudo ou restaure uma cópia anterior.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;padding-bottom:6px"><button class="btn" data-act="export">Copiar backup</button><button class="btn" data-act="import">Restaurar backup</button><button class="btn danger" data-act="reset">Apagar tudo e recomeçar</button></div>
      </div>
    </section>`;
  },
};
/* ---- cloud.js ---- */
/* =====================================================================
   NOVA · cloud.js — conta e sincronização com o Supabase
   Só entra em ação quando window.NOVA_CONFIG tem URL e chave preenchidas.
   Sem configuração, o app continua funcionando como antes (só no navegador).
   ===================================================================== */
const Cloud = {
  LIB: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js',
  sb: null, user: null, remoteMs: 0, timer: null, pullTimer: null, saving: false, pending: false, recovery: false,

  cfg() { const c = Object.assign({}, window.NOVA_CONFIG || {}); if (c.supabaseUrl) c.supabaseUrl = String(c.supabaseUrl).trim().replace(/\/(rest|auth)\/v1\/?.*$/, '').replace(/\/+$/, ''); return c; },
  enabled() { const c = this.cfg(); return !!(c.supabaseUrl && c.supabaseAnonKey); },

  loadLib() {
    if (window.supabase && window.supabase.createClient) return Promise.resolve();
    return new Promise((ok, fail) => {
      const s = document.createElement('script'); s.src = this.LIB; s.onload = ok;
      s.onerror = () => fail(new Error('lib')); document.head.appendChild(s);
    });
  },

  /* Portão de entrada: só libera o app depois do login */
  async gate() {
    this.recovery = /type=recovery/.test(location.hash);
    try { await this.loadLib(); }
    catch (e) { this.screen('erro', 'Não foi possível conectar. Verifique sua internet e recarregue a página.'); return new Promise(() => { }); }
    const c = this.cfg();
    this.sb = window.supabase.createClient(c.supabaseUrl, c.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    return new Promise(resolve => {
      this.resolve = resolve;
      this.sb.auth.onAuthStateChange((ev, session) => {
        if (ev === 'PASSWORD_RECOVERY') { this.recovery = true; this.screen('nova-senha'); }
        if (ev === 'SIGNED_OUT' && this.user) location.reload();
        if (session && session.user && this.user && session.user.id !== this.user.id) location.reload();
      });
      this.sb.auth.getSession().then(({ data }) => {
        const session = data && data.session;
        if (this.recovery) return this.screen('nova-senha');
        if (session) this.enter(session.user); else this.screen('entrar');
      }).catch(() => this.screen('entrar'));
    });
  },

  /* Usuário autenticado: prepara os dados dele e abre o app */
  async enter(user) {
    this.user = user;
    Store.KEY = 'nova:v1:' + user.id;
    let hasLocal = false; try { hasLocal = !!localStorage.getItem(Store.KEY); } catch (e) { }
    // aproveita dados usados antes do login (não perde nada)
    if (!hasLocal) { try { const old = localStorage.getItem('nova:v1'); if (old) { localStorage.setItem(Store.KEY, old); localStorage.setItem('nova:v1:copiado-para', user.id); } } catch (e) { } }
    Store.state = null; Store.load();
    this.msg('Carregando seus dados…');
    try {
      const remote = await this.fetch();
      if (remote && remote.ms > (Store.state.updatedAt || 0)) { Store.state = migrate(remote.dados); Store.persistLocal(); }
    } catch (e) { console.warn('[NOVA] sem conexão; usando a cópia deste aparelho', e); }
    const el = $('.onb'); if (el && el.dataset.cloud) el.remove();
    const r = this.resolve; this.resolve = null; if (r) r();
  },

  async fetch() {
    const { data, error } = await this.sb.from('nova_dados').select('dados, atualizado_ms').eq('user_id', this.user.id).maybeSingle();
    if (error) throw error;
    if (!data) { this.remoteMs = 0; return null; }
    this.remoteMs = Number(data.atualizado_ms) || 0;
    return { dados: data.dados, ms: this.remoteMs };
  },

  /* Chamado por Sync.init depois que o app abriu */
  start() {
    Sync.mode = 'supabase'; Sync.status = 'cloud'; App.renderSync();
    if ((Store.state.updatedAt || 0) > this.remoteMs) this.push(true);
    const pull = () => this.pull();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
    window.addEventListener('focus', pull);
    window.addEventListener('online', () => { this.pull(); if (this.pending) this.push(true); });
    clearInterval(this.pullTimer); this.pullTimer = setInterval(pull, 120000);
  },

  push(now) {
    if (!this.user) return;
    this.pending = true; clearTimeout(this.timer);
    this.timer = setTimeout(() => this.save(), now ? 0 : 1500);
  },
  async save() {
    if (this.saving) { this.timer = setTimeout(() => this.save(), 800); return; }
    this.saving = true; this.pending = false;
    const ms = Store.state.updatedAt || Date.now();
    try {
      const { data, error } = await this.sb.rpc('nova_salvar', { p_dados: Store.state, p_ms: ms });
      if (error) throw error;
      if (data === false) await this.pull(true); // outro aparelho salvou algo mais novo
      else { this.remoteMs = Math.max(this.remoteMs, ms); this.setStatus('cloud'); }
    } catch (e) { this.pending = true; this.setStatus('local'); console.warn('[NOVA] falha ao salvar na nuvem; tentando de novo depois', e); }
    this.saving = false;
  },
  async pull(force) {
    if (!this.user || this.saving) return;
    if (!force && (UI.isOpen() || $('.focus'))) return;
    try {
      const remote = await this.fetch();
      this.setStatus('cloud');
      if (remote && remote.ms > (Store.state.updatedAt || 0)) {
        Store.state = migrate(remote.dados); Store.persistLocal(); App.applyTheme(); App.render(true);
      }
    } catch (e) { this.setStatus('local'); }
  },
  setStatus(s) { if (Sync.status !== s) { Sync.status = s; App.renderSync(); } },

  async logout() {
    UI.close(); UI.snack('Salvando antes de sair…');
    try {
      clearTimeout(this.timer);
      const ms = Store.state.updatedAt || Date.now();
      const { data, error } = await this.sb.rpc('nova_salvar', { p_dados: Store.state, p_ms: ms });
      if (error) throw error;
      if (data !== false || ms <= this.remoteMs) { try { localStorage.removeItem(Store.KEY); } catch (e) { } }
    } catch (e) {
      UI.snack('Sem conexão: seus dados ficam guardados neste aparelho até a próxima entrada.');
    }
    const u = this.user; this.user = null;
    await this.sb.auth.signOut().catch(() => { });
    if (u) location.reload();
  },

  /* ---------- telas de conta ---------- */
  err(e) {
    const m = String((e && e.message) || e || '');
    if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
    if (/not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link que enviamos e tente de novo.';
    if (/already registered|already been registered/i.test(m)) return 'Este e-mail já tem conta. Use “Entrar”.';
    if (/password.*(6|characters|short)/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
    if (/rate limit|too many/i.test(m)) return 'Muitas tentativas. Aguarde alguns minutos.';
    if (/valid email|invalid.*email/i.test(m)) return 'Digite um e-mail válido.';
    if (/fetch|network/i.test(m)) return 'Sem conexão com a internet.';
    return 'Não foi possível concluir. Tente novamente.';
  },
  card() {
    let el = $('.onb[data-cloud]');
    if (!el) { el = document.createElement('div'); el.className = 'onb'; el.dataset.cloud = '1'; document.body.appendChild(el); }
    return el;
  },
  msg(t) { this.card().innerHTML = `<div class="onb-card"><div class="orbit"></div><h1>NOVA</h1><p>${esc(t)}</p></div>`; },
  screen(kind, info) {
    const el = this.card();
    const head = (h, p) => `<div class="onb-card" role="dialog" aria-label="${esc(h)}"><div class="orbit"></div><h1>${h}</h1><p>${p}</p>`;
    const note = `<p class="muted" id="cl-msg" role="status" style="min-height:20px;margin:4px 0 14px"></p>`;
    if (kind === 'erro') { el.innerHTML = head('NOVA', esc(info)) + `<div class="foot"><button class="btn primary" onclick="location.reload()">Tentar de novo</button></div></div>`; return; }
    if (kind === 'entrar' || kind === 'criar') {
      const c = kind === 'criar';
      el.innerHTML = head(c ? 'Criar sua conta' : 'Entrar no NOVA', c ? 'Seus dados ficam guardados com segurança e aparecem em qualquer aparelho.' : 'Você coloca tudo na cabeça. O NOVA organiza, lembra e ajuda você a executar.') + `
        <label class="field"><span>E-mail</span><input class="input" type="email" id="cl-email" autocomplete="email" inputmode="email"></label>
        <label class="field"><span>Senha</span><input class="input" type="password" id="cl-pass" autocomplete="${c ? 'new-password' : 'current-password'}" placeholder="${c ? 'Mínimo de 6 caracteres' : ''}"></label>
        ${note}
        <div class="foot"><button class="btn primary" id="cl-go">${c ? 'Criar conta' : 'Entrar'}</button>
          <button class="btn ghost" id="cl-switch">${c ? 'Já tenho conta' : 'Criar conta'}</button></div>
        ${c ? '' : '<p style="margin-top:14px"><button class="btn ghost" id="cl-forgot" style="padding-left:0">Esqueci minha senha</button></p>'}</div>`;
      $('#cl-email').focus();
      $('#cl-switch').onclick = () => this.screen(c ? 'entrar' : 'criar');
      if ($('#cl-forgot')) $('#cl-forgot').onclick = () => this.screen('esqueci', $('#cl-email').value);
      const go = async () => {
        const email = $('#cl-email').value.trim(), password = $('#cl-pass').value, out = $('#cl-msg'), btn = $('#cl-go');
        if (!email || !password) { out.textContent = 'Preencha e-mail e senha.'; return; }
        btn.disabled = true; out.textContent = c ? 'Criando conta…' : 'Entrando…';
        try {
          if (c) {
            const { data, error } = await this.sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
            if (error) throw error;
            if (data.session) return this.enter(data.session.user);
            out.textContent = 'Pronto! Enviamos um link de confirmação para ' + email + '. Abra o e-mail, confirme e depois entre aqui.';
          } else {
            const { data, error } = await this.sb.auth.signInWithPassword({ email, password });
            if (error) throw error;
            return this.enter(data.user);
          }
        } catch (e) { out.textContent = this.err(e); }
        btn.disabled = false;
      };
      $('#cl-go').onclick = go;
      el.querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') go(); });
      return;
    }
    if (kind === 'esqueci') {
      el.innerHTML = head('Recuperar senha', 'Digite seu e-mail. Vamos enviar um link para você criar uma senha nova.') + `
        <label class="field"><span>E-mail</span><input class="input" type="email" id="cl-email" value="${esc(info || '')}" autocomplete="email"></label>${note}
        <div class="foot"><button class="btn primary" id="cl-go">Enviar link</button><button class="btn ghost" id="cl-back">Voltar</button></div></div>`;
      $('#cl-email').focus(); $('#cl-back').onclick = () => this.screen('entrar');
      $('#cl-go').onclick = async () => {
        const email = $('#cl-email').value.trim(), out = $('#cl-msg'); if (!email) { out.textContent = 'Digite seu e-mail.'; return; }
        $('#cl-go').disabled = true; out.textContent = 'Enviando…';
        try {
          const { error } = await this.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
          if (error) throw error; out.textContent = 'Se este e-mail tiver conta, o link chega em instantes. Confira também o spam.';
        } catch (e) { out.textContent = this.err(e); $('#cl-go').disabled = false; }
      };
      return;
    }
    if (kind === 'nova-senha') {
      el.innerHTML = head('Criar nova senha', 'Escolha uma senha nova para sua conta.') + `
        <label class="field"><span>Nova senha</span><input class="input" type="password" id="cl-pass" autocomplete="new-password" placeholder="Mínimo de 6 caracteres"></label>
        <label class="field"><span>Repita a senha</span><input class="input" type="password" id="cl-pass2" autocomplete="new-password"></label>${note}
        <div class="foot"><button class="btn primary" id="cl-go">Salvar senha</button></div></div>`;
      $('#cl-pass').focus();
      $('#cl-go').onclick = async () => {
        const a = $('#cl-pass').value, b = $('#cl-pass2').value, out = $('#cl-msg');
        if (a.length < 6) { out.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
        if (a !== b) { out.textContent = 'As senhas não são iguais.'; return; }
        $('#cl-go').disabled = true; out.textContent = 'Salvando…';
        try {
          const { data, error } = await this.sb.auth.updateUser({ password: a }); if (error) throw error;
          this.recovery = false; history.replaceState(null, '', location.pathname);
          const { data: s } = await this.sb.auth.getSession();
          const u = (s && s.session && s.session.user) || (data && data.user);
          if (u) this.enter(u); else this.screen('entrar');
        } catch (e) { out.textContent = this.err(e) + ' O link pode ter expirado: peça outro em “Esqueci minha senha”.'; $('#cl-go').disabled = false; }
      };
    }
  },
};

/* =====================================================================
   NOVA — aplicação: navegação, ações, modais e eventos
   ===================================================================== */
const NAV = [
  ['today', 'Hoje', 'today'], ['agenda', 'Agenda', 'agenda'], ['tasks', 'Tarefas', 'tasks'], ['planner', 'Planner', 'planner'],
  ['projects', 'Projetos', 'projects'], ['dontforget', 'Não esquecer', 'dontforget'], ['notes', 'Notas', 'notes'], ['routines', 'Rotinas', 'routines'],
  ['summary', 'Resumo', 'summary'], ['settings', 'Configurações', 'settings'],
];
const WIDE = ['agenda', 'planner'];

const UI = {
  onClose: null,
  open(html, { cls = '', onClose = null, label = 'Janela' } = {}) {
    const root = $('#modal');
    root.innerHTML = `<div class="scrim" data-act="close-modal"></div><div class="dialog ${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
    root.hidden = false; this.onClose = onClose;
    setTimeout(() => { const f = root.querySelector('[autofocus]') || root.querySelector('input,textarea,select,button:not(.x)'); f && f.focus(); }, 30);
  },
  close() { const root = $('#modal'); if (root.hidden) return; root.hidden = true; root.innerHTML = ''; const cb = this.onClose; this.onClose = null; Speech.stop(); cb && cb(); },
  isOpen() { return !$('#modal').hidden; },
  snack(text, undo) {
    const box = $('#toasts'), el = document.createElement('div'); el.className = 'snack';
    el.innerHTML = `<span>${esc(text)}</span>${undo ? '<button>Desfazer</button>' : ''}`;
    if (undo) el.querySelector('button').onclick = () => { undo(); el.remove(); };
    box.appendChild(el); setTimeout(() => el.remove(), 5000);
  },
  sheet(title, items, sub = '') {
    this.open(`<button class="btn ghost icon x" data-act="close-modal" aria-label="Fechar">${icon('x')}</button><h2>${esc(title)}</h2>${sub ? `<p class="sub">${sub}</p>` : '<div style="height:10px"></div>'}
      <div class="sheet-list">${items.map(it => it === '-' ? '<hr>' : `<button class="${it.cls || ''}" data-act="${it.act}" ${Object.entries(it.data || {}).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ')}>${it.icon ? icon(it.icon, 18) : ''}${esc(it.label)}${it.hint ? `<small>${esc(it.hint)}</small>` : ''}</button>`).join('')}</div>`, { cls: 'sm', label: title });
  },
};

const App = {
  route: 'today', snapshot: null,
  params: {
    agenda: { view: 'week', date: todayStr() }, tasks: { filter: 'today', project: '', tag: '' },
    planner: { week: weekStart(todayStr()) }, projects: { id: null }, summary: { week: weekStart(todayStr()) },
  },
  isMobile: () => window.matchMedia('(max-width:759px)').matches,

  init() {
    Store.load(); this.applyTheme();
    const h = location.hash.slice(1); if (NAV.some(n => n[0] === h)) this.route = h;
    if (this.isMobile()) this.params.agenda.view = 'month';
    this.renderShell(); this.render(true); this.bind();
    if (!Store.state.user.onboarded) Onboarding.show();
    Notify.start(); Sync.init();
    setInterval(() => { if (!UI.isOpen() && !document.hidden && !$('.focus') && !document.activeElement.matches('input,textarea,select')) this.render(); }, 60000);
  },
  applyTheme() {
    const s = Store.state.settings, root = document.documentElement;
    if (s.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', s.theme);
    root.style.setProperty('--accent', (ACCENTS[s.accent] || ACCENTS.petroleo)[1]);
  },
  go(route) {
    if (!NAV.some(n => n[0] === route)) return;
    this.route = route; if (location.hash.slice(1) !== route) history.replaceState(null, '', '#' + route);
    if (route === 'projects') this.params.projects.id = this.params.projects.id || null;
    UI.close(); this.render(true); window.scrollTo(0, 0);
  },
  renderShell() {
    const s = Store.state;
    $('#sidebar').innerHTML = `<div class="brand"><i class="brand-mark"></i><span>NOVA</span></div>
      ${NAV.map(([k, l, ic], idx) => `${idx === 4 || idx === 8 ? '<div class="nav-sep"></div>' : ''}<button class="nav-btn" data-act="go" data-r="${k}" title="${l}">${icon(ic)}<span class="lbl">${l}</span><span class="count" data-count="${k}"></span></button>`).join('')}
      <button class="side-capture" data-act="capture" title="Nova tarefa (N)">${icon('plus')}<span class="lbl">Nova tarefa</span></button>
      <div class="sync" id="sync"><i></i><span>Salvo neste dispositivo</span></div>`;
    $('#topbar').innerHTML = `<div class="brand"><i class="brand-mark"></i><span>NOVA</span></div>
      <button class="btn ghost icon" data-act="search" aria-label="Buscar">${icon('search')}</button>
      <button class="btn ghost icon" data-act="drawer" aria-label="Menu">${icon('menu')}</button>`;
    $('#bottomnav').innerHTML = `${[['today', 'Hoje'], ['agenda', 'Agenda']].map(([k, l]) => `<button class="bn" data-act="go" data-r="${k}">${icon(k, 22)}${l}</button>`).join('')}
      <button class="bn-plus" data-act="capture" aria-label="Nova tarefa">${icon('plus', 26)}</button>
      ${[['tasks', 'Tarefas'], ['planner', 'Planner']].map(([k, l]) => `<button class="bn" data-act="go" data-r="${k}">${icon(k, 22)}${l}</button>`).join('')}`;
    this.renderSync();
  },
  renderSync() { const el = $('#sync'); if (!el) return; el.classList.toggle('cloud', Sync.status === 'cloud'); el.querySelector('span').textContent = Sync.status === 'cloud' ? 'Sincronizado' : 'Salvo neste dispositivo'; },
  render(force) {
    this.applyTheme();
    document.body.classList.toggle('wide', WIDE.includes(this.route));
    $$('[data-act="go"]').forEach(b => { if (b.dataset.r === this.route) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    const T = todayStr(), st = Sched.stats(T), late = Tasks.overdue().length;
    const counts = { today: st.pend.length, tasks: late ? late : '', dontforget: Store.state.tasks.filter(t => t.mustNotForget && t.status !== 'done').length || '', notes: Store.state.notes.length || '' };
    $$('[data-count]').forEach(el => { const k = el.dataset.count; el.textContent = counts[k] ?? ''; el.classList.toggle('alert', k === 'tasks' && !!late); });
    const main = $('#view'), y = window.scrollY;
    main.innerHTML = Views[this.route]();
    if (!force) window.scrollTo(0, y);
    this.renderAside();
  },
  renderAside() {
    const T = todayStr(), nm = nowMin();
    const next = [...Tasks.on(T).filter(i => i.time && !i.done && toMin(i.time) + i.dur >= nm), ...Tasks.on(addDays(T, 1)).filter(i => i.time && !i.done)].slice(0, 6);
    const wk = weekDays(weekStart(T));
    $('#aside').innerHTML = `<section><h3>Próximos</h3>${next.length ? next.map(i => `<div class="next-item"><b>${i.time}</b><div>${i.t.type === 'event' ? '📅 ' : i.t.type === 'reminder' ? '🔔 ' : ''}${esc(i.t.title)}<small>${i.date === T ? (toMin(i.time) <= nm ? 'agora' : 'em ' + fmtDur(toMin(i.time) - nm)) : 'amanhã'}${i.dur ? ' · ' + fmtDur(i.dur) : ''}</small></div></div>`).join('') : '<p class="muted" style="margin:0">Nada marcado por enquanto.</p>'}</section>
      <section><h3>Anotar agora</h3><textarea class="note-input" id="aside-note" placeholder="Uma ideia, um recado…" aria-label="Anotar agora"></textarea><button class="btn sm" style="margin-top:8px" data-act="note-add" data-src="aside-note">Guardar nota</button></section>
      <section><h3>Carga da semana</h3>${wk.map(d => { const s = Sched.stats(d); return `<div style="display:flex;align-items:center;gap:10px;font-size:13px;margin:6px 0"><span style="width:34px;color:var(--ink-3)">${DOW_S[parseYmd(d).getDay()]}</span><div class="pbar ${s.level}" style="flex:1;margin:0"><i style="width:${s.available > 0 ? Math.min(100, s.planned / s.available * 100) : (s.planned ? 100 : 0)}%"></i></div><span style="width:44px;text-align:right;color:var(--ink-2)">${fmtDur(s.planned)}</span></div>`; }).join('')}</section>`;
  },

  bind() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]'); if (!el) return;
      if (el.tagName === 'INPUT' && el.type === 'checkbox') return; // tratado em change
      const fn = Actions[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
    });
    document.addEventListener('change', e => {
      const el = e.target;
      if (el.dataset.act && el.type === 'checkbox' && Actions[el.dataset.act]) return Actions[el.dataset.act](el.dataset, el, e);
      const k = el.dataset.change; if (k && Changes[k]) Changes[k](el.dataset, el);
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { if ($('.focus')) return Focus.close(); if (UI.isOpen()) return UI.close(); }
      const typing = document.activeElement && document.activeElement.matches('input,textarea,select,[contenteditable]');
      if (typing || UI.isOpen() || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); Modals.capture({}); }
      if (e.key === '/') { e.preventDefault(); Modals.search(); }
    });
    // arrastar e soltar (desktop)
    document.addEventListener('dragstart', e => { const el = e.target.closest('[draggable="true"][data-key]'); if (!el) return; e.dataTransfer.setData('text/plain', el.dataset.key); e.dataTransfer.effectAllowed = 'move'; el.classList.add('dragging'); });
    document.addEventListener('dragend', e => { const el = e.target.closest && e.target.closest('[data-key]'); el && el.classList.remove('dragging'); $$('.drop-on').forEach(x => x.classList.remove('drop-on')); });
    document.addEventListener('dragover', e => { const z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); $$('.drop-on').forEach(x => x !== z && x.classList.remove('drop-on')); z.classList.add('drop-on'); });
    document.addEventListener('drop', e => {
      const z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.remove('drop-on');
      const key = e.dataTransfer.getData('text/plain'); if (!key) return;
      Actions.moveTo({ key, date: z.dataset.drop });
    });
    window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== this.route && NAV.some(n => n[0] === h)) this.go(h); });
    let lastMobile = this.isMobile();
    window.addEventListener('resize', () => { const m = this.isMobile(); if (m !== lastMobile) { lastMobile = m; this.render(); } });
  },
};

/* ---------- mudanças em campos de formulário ---------- */
const setPath = (obj, path, val) => { const ks = path.split('.'); let o = obj; ks.slice(0, -1).forEach(k => o = o[k]); o[ks[ks.length - 1]] = val; };
const Changes = {
  'set-bool': (d, el) => Store.commit(s => setPath(s, d.path, el.checked)),
  'set-val': (d, el) => { if (d.path.startsWith('user.') && /day/.test(d.path) && !el.value) return; Store.commit(s => setPath(s, d.path, el.value.trim ? el.value.trim() : el.value)); },
  'set-num': (d, el) => Store.commit(s => setPath(s, d.path, Number(el.value))),
  'task-project': (d, el) => { App.params.tasks.project = el.value; App.render(); },
  'task-tag': (d, el) => { App.params.tasks.tag = el.value; App.render(); },
  'notif-browser': async (d, el) => {
    if (el.checked) { const p = await BrowserChannel.request(); Store.commit(s => s.settings.notif.browser = p === 'granted'); if (p !== 'granted') UI.snack('O navegador não liberou os avisos. Eles continuam aparecendo dentro do app.'); }
    else Store.commit(s => s.settings.notif.browser = false);
  },
};

/* ---------- ações ---------- */
const Actions = {
  go: d => App.go(d.r),
  'close-modal': () => UI.close(),
  capture: d => Modals.capture({ date: d.date, time: d.time, project: d.project }),
  search: () => Modals.search(),
  drawer: () => UI.sheet('Menu', NAV.map(([k, l, ic]) => ({ act: 'go', label: l, icon: ic, data: { r: k } }))),
  edit: d => Modals.editor(d.key),
  toggle: d => {
    const i = Tasks.get(d.key); if (!i) return;
    const val = !i.done; Store.commit(s => Tasks._complete(s, d.key, val));
    if (val) UI.snack(`Concluída: ${i.t.title}`, () => Store.commit(s => Tasks._complete(s, d.key, false)));
  },
  menu: d => Modals.menu(d.key),
  moveTo: d => {
    const i = Tasks.get(d.key); if (!i) return;
    if (d.date === 'none') { if (i.rec) return UI.snack('Tarefas recorrentes precisam de data.'); Store.commit(s => { i.t.date = null; i.t.time = null; }); return; }
    if (i.date === d.date) return;
    const later = !i.date || d.date > i.date;
    Store.commit(s => Tasks._move(s, d.key, d.date, d.time === undefined ? undefined : (d.time || null), later && !!i.date));
    UI.close(); UI.snack(`Movida para ${relDay(d.date).toLowerCase() === 'hoje' ? 'hoje' : relDay(d.date)}`);
  },
  'move-pick': d => Modals.pickDate(d.key),
  postpone: d => Modals.postpone(d.key),
  'postpone-to': d => {
    const i = Tasks.get(d.key); if (!i) return; const T = todayStr();
    let date, time;
    if (d.opt === 'afternoon') { date = T; time = fromMin(Math.max(14 * 60, Math.ceil((nowMin() + 15) / 15) * 15)); }
    else if (d.opt === 'tomorrow') { date = addDays(T, 1); time = i.time ? i.time : null; }
    else if (d.opt === 'nextweek') { date = addDays(weekStart(T), 7); time = null; }
    else if (d.opt === 'auto') { const slot = Sched.findSlot(i, T, nowMin() + 5); date = slot.date; time = slot.time; }
    Store.commit(s => Tasks._move(s, d.key, date, time, true)); UI.close();
    UI.snack(`Remarcada para ${relDay(date).toLowerCase()}${time ? ' às ' + time : ''}`);
  },
  delete: d => {
    const i = Tasks.get(d.key); if (!i) return;
    if (i.rec) return UI.sheet('Excluir tarefa recorrente', [{ act: 'delete-do', label: 'Só esta ocorrência', data: { key: d.key, scope: 'one' } }, { act: 'delete-do', label: 'Todas as ocorrências', cls: 'danger', data: { key: d.key, scope: 'all' } }]);
    Actions['delete-do']({ key: d.key, scope: 'all' });
  },
  'delete-do': d => {
    const before = clone(Store.state.tasks); const i = Tasks.get(d.key); if (!i) return;
    Store.commit(s => Tasks._remove(s, d.key, d.scope)); UI.close();
    UI.snack(`Excluída: ${i.t.title}`, () => Store.commit(s => { s.tasks = before; }));
  },
  'toggle-df': d => { const i = Tasks.get(d.key); Store.commit(() => { i.t.mustNotForget = !i.t.mustNotForget; }); UI.close(); },
  focus: d => Focus.open(d.key),
  organize: d => Modals.organize(d.date || todayStr()),
  'apply-plan': () => { const p = App.snapshot; if (!p) return; const mv = $('#plan-move'); Sched.applyPlan(p, mv ? mv.checked : true); UI.close(); UI.snack('Dia organizado.'); },
  rollover: d => Modals.rollover(d.date || todayStr()),
  'apply-moves': () => { const mv = App.snapshot; if (!mv) return; Store.commit(s => mv.forEach(m => Tasks._move(s, m.inst.key, m.date, m.time === undefined ? null : m.time, true))); UI.close(); UI.snack('Tarefas reorganizadas.'); },
  'suggest-undated': () => Modals.suggestUndated(),
  fit: d => { Store.commit(s => Tasks._move(s, d.key, todayStr(), d.time)); UI.snack(`Encaixada às ${d.time}`); },
  'goto-late': () => { const el = $('#late'); el && el.scrollIntoView({ behavior: 'smooth' }); },
  'dismiss-hint': d => Store.commit(s => { s.dismissed[d.id + '|' + todayStr()] = 1; }),
  'agenda-view': d => { App.params.agenda.view = d.v; App.render(); },
  'agenda-nav': d => {
    const p = App.params.agenda, n = +d.n;
    if (!n) p.date = todayStr();
    else if (p.view === 'month') { const x = parseYmd(p.date); x.setDate(1); x.setMonth(x.getMonth() + n); p.date = ymd(x); }
    else p.date = addDays(p.date, n * (p.view === 'week' ? 7 : 1));
    App.render();
  },
  'agenda-day': d => { App.params.agenda.view = 'day'; App.params.agenda.date = d.date; App.render(); },
  'agenda-pick': d => { App.params.agenda.date = d.date; App.render(); },
  'planner-nav': d => { const n = +d.n; App.params.planner.week = n ? addDays(App.params.planner.week, n * 7) : weekStart(todayStr()); App.render(); },
  'summary-nav': d => { const n = +d.n; App.params.summary.week = n ? addDays(App.params.summary.week, n * 7) : weekStart(todayStr()); App.render(); },
  'task-filter': d => { App.params.tasks.filter = d.f; App.render(); },
  'project-open': d => { App.params.projects.id = d.id || null; if (App.route !== 'projects') App.go('projects'); else App.render(true); },
  'edit-project': d => Modals.project(d.id),
  'note-add': d => {
    const el = $('#' + (d.src || 'note-input')); const txt = el && el.value.trim(); if (!txt) return el && el.focus();
    Store.commit(s => s.notes.push({ id: uid(), text: txt, createdAt: Date.now() })); UI.snack('Nota guardada.');
  },
  'note-del': d => { const before = clone(Store.state.notes); Store.commit(s => s.notes = s.notes.filter(n => n.id !== d.id)); UI.snack('Nota excluída.', () => Store.commit(s => s.notes = before)); },
  'note-to-task': d => { const n = Store.state.notes.find(x => x.id === d.id); if (n) Modals.capture({ text: n.text, fromNote: n.id }); },
  'df-add': () => {
    const el = $('#df-input'), txt = el.value.trim(); if (!txt) return el.focus();
    const p = Parser.parse(txt); Store.commit(s => s.tasks.push(mkTask({ title: p.title || txt, date: p.date, time: p.time, priority: 1, mustNotForget: true, reminder: p.reminder ?? (p.time ? s.settings.notif.defaultReminder : (p.date ? 1440 : null)), recurrence: p.recurrence, duration: p.duration || 15 })));
  },
  'routine-check': (d, el) => Store.commit(s => { const r = s.routines.find(x => x.id === d.id); r.checks = r.checks || {}; const c = r.checks[d.date] = r.checks[d.date] || {}; if (el.checked) c[d.k] = 1; else delete c[d.k]; Object.keys(r.checks).forEach(k => { if (k < addDays(todayStr(), -14)) delete r.checks[k]; }); }),
  'routine-day': d => Store.commit(s => { const r = s.routines.find(x => x.id === d.id); const v = +d.d; r.days = r.days.includes(v) ? r.days.filter(x => x !== v) : [...r.days, v]; }),
  'edit-routine': d => Modals.routine(d.id),
  'set-theme': d => Store.commit(s => s.settings.theme = d.v),
  'set-accent': d => Store.commit(s => s.settings.accent = d.v),
  'notif-test': () => Notify.test(),
  export: () => Modals.backup(),
  import: () => Modals.restore(),
  logout: () => UI.sheet('Sair da conta?', [{ act: 'logout-do', label: 'Sair', cls: 'danger' }, { act: 'close-modal', label: 'Cancelar' }], 'Seus dados ficam salvos na nuvem. Ao entrar de novo, tudo volta como estava.'),
  'logout-do': () => Cloud.logout(),
  reset: () => UI.sheet('Apagar tudo?', [{ act: 'reset-do', label: 'Sim, apagar todos os dados', cls: 'danger', icon: 'trash' }, { act: 'close-modal', label: 'Cancelar' }], 'Tarefas, notas, projetos e configurações serão removidos. Faça um backup antes, se quiser guardar algo.'),
  'reset-do': () => { Store.state = defaultState(); Store.save(); UI.close(); App.render(true); Onboarding.show(); },
  // ações vindas das notificações
  nt: (d, el) => {
    const toast = el.closest('.toast'); toast && toast.remove();
    const i = d.key ? Tasks.get(d.key) : null;
    switch (d.op) {
      case 'done': if (i) Store.commit(s => Tasks._complete(s, d.key, true)); break;
      case 'snooze': if (i) Store.commit(s => { if (i.time && i.date === todayStr() && !i.t.persistent) Tasks._move(s, d.key, i.date, fromMin(Math.max(toMin(i.time), nowMin()) + 30)); else i.t.snoozeUntil = Date.now() + 30 * 60000; }); UI.snack('Vou lembrar de novo em 30 minutos.'); break;
      case 'postpone': case 'pick': if (i) Modals.postpone(d.key); break;
      case 'open': if (i) Modals.editor(d.key); break;
      case 'today': App.go('today'); break;
      case 'organize': Modals.organize(todayStr()); break;
      case 'rollover': Modals.rollover(todayStr()); break;
      case 'planner': App.go('planner'); break;
    }
  },
};

/* ---------- modais ---------- */
const Modals = {
  /* captura rápida em linguagem natural */
  capture(o = {}) {
    const ex = ['Me lembra amanhã às 15h de enviar o orçamento', 'Criar post da Dra. na sexta às 9h, leva 1 hora', 'Pagar conta todo dia 10', 'Reunião com cliente segunda às 10h'];
    UI.open(`<button class="btn ghost icon x" data-act="close-modal" aria-label="Fechar">${icon('x')}</button>
      <h2>Nova tarefa</h2><p class="sub">Escreva do seu jeito. O NOVA entende data, hora, duração e repetição.</p>
      <div class="qc-wrap"><textarea id="qc" class="qc-input" rows="2" placeholder="O que você precisa lembrar?" autofocus aria-label="Descreva a tarefa">${esc(o.text || '')}</textarea>
        <button class="mic" id="qc-mic" type="button" aria-label="Falar" title="${Speech.supported() ? 'Falar' : 'Voz não disponível neste navegador'}">${icon('mic')}</button></div>
      <div class="parsed" id="qc-parsed" aria-live="polite"></div>
      <p class="qc-examples" id="qc-ex">Exemplos: ${ex.map(x => `<button type="button" data-ex="${esc(x)}">${esc(x)}</button>`).join(' · ')}</p>
      <div class="dialog-foot"><button class="btn ghost left" id="qc-note">Salvar como nota</button><button class="btn" id="qc-more">Mais detalhes</button><button class="btn primary" id="qc-add">Adicionar</button></div>`, { label: 'Nova tarefa' });
    const ta = $('#qc'), out = $('#qc-parsed');
    const build = () => {
      const p = Parser.parse(ta.value), s = Store.state;
      const t = mkTask({ title: p.title || ta.value.trim(), date: p.date ?? o.date ?? (o.time ? todayStr() : null), time: p.time ?? o.time ?? null, duration: p.duration || (p.type === 'event' ? 60 : 30), priority: p.priority || 3, type: p.type || 'task', recurrence: p.recurrence, mustNotForget: p.mustNotForget, projectId: o.project || null });
      t.reminder = p.reminder ?? (t.time ? s.settings.notif.defaultReminder : (p.intent && t.date ? 0 : null));
      if (p.intent && !t.time && t.date) { t.time = '09:00'; t.reminder = p.reminder ?? 0; }
      if (t.priority === 1 && t.reminder != null && p.intent) t.persistent = true;
      return { t, p };
    };
    const show = () => {
      if (!ta.value.trim()) { out.innerHTML = ''; return; }
      const { t } = build(), chips = [];
      chips.push(`<span>${t.type === 'event' ? '📅' : '☑'} <b>${esc(t.title || '…')}</b></span>`);
      if (t.date) chips.push(`<span>${relDay(t.date)}${relDay(t.date) === 'Hoje' || relDay(t.date) === 'Amanhã' ? ' · ' + fmtShort(t.date) : ''}</span>`);
      if (t.time) chips.push(`<span>${t.time}</span>`);
      chips.push(`<span>${fmtDur(t.duration)}</span>`);
      if (t.reminder != null) chips.push(`<span>🔔 ${reminderLabel(t.reminder)}</span>`);
      if (t.recurrence) chips.push(`<span>${icon('repeat', 12).replace('class="ic"', 'class="ic" style="display:inline;vertical-align:-1px"')} ${recLabel(t.recurrence)}</span>`);
      if (t.priority === 1) chips.push('<span>Importante</span>');
      if (t.mustNotForget) chips.push('<span>🧠 Não esquecer</span>');
      out.innerHTML = chips.join('');
    };
    const add = () => {
      if (!ta.value.trim()) return ta.focus();
      const { t } = build(); Store.commit(s => { s.tasks.push(t); if (o.fromNote) s.notes = s.notes.filter(n => n.id !== o.fromNote); });
      UI.close(); UI.snack(`Adicionada${t.date ? ' para ' + relDay(t.date).toLowerCase() : ''}${t.time ? ' às ' + t.time : ''}`, () => Store.commit(s => s.tasks = s.tasks.filter(x => x.id !== t.id)));
      const st = t.date ? Sched.stats(t.date) : null;
      if (st && st.level === 'over' && t.date === todayStr()) setTimeout(() => UI.snack('Seu dia ficou sobrecarregado. Toque em “Organizar meu dia” quando quiser.'), 600);
    };
    ta.addEventListener('input', show);
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); add(); } });
    $('#qc-add').onclick = add;
    $('#qc-more').onclick = () => { const { t } = build(); UI.close(); Modals.editor(null, t, o.fromNote); };
    $('#qc-note').onclick = () => { const v = ta.value.trim(); if (!v) return ta.focus(); Store.commit(s => s.notes.push({ id: uid(), text: v, createdAt: Date.now() })); UI.close(); UI.snack('Nota guardada.'); };
    $('#qc-ex').onclick = e => { const b = e.target.closest('[data-ex]'); if (b) { ta.value = b.dataset.ex; show(); ta.focus(); } };
    const mic = $('#qc-mic');
    mic.onclick = () => {
      if (!Speech.supported()) { UI.snack('Voz não está disponível neste navegador. Tente pelo Chrome ou digite.'); return; }
      if (mic.classList.contains('on')) { Speech.stop(); return; }
      mic.classList.add('on'); const base = ta.value ? ta.value + ' ' : '';
      Speech.start((txt) => { ta.value = base + txt; show(); }, err => { mic.classList.remove('on'); if (err && err !== 'no-speech' && err !== 'aborted') UI.snack(err === 'not-allowed' || err === 'service-not-allowed' ? 'O microfone foi bloqueado. Libere a permissão ou digite.' : 'Não consegui ouvir. Tente de novo ou digite.'); });
    };
    show();
  },

  /* editor completo */
  editor(key, draft, fromNote) {
    const existing = key ? Tasks.get(key) : null;
    if (key && !existing) return;
    const t = existing ? clone(existing.t) : (draft || mkTask({ reminder: Store.state.settings.notif.defaultReminder }));
    const isNew = !existing, s = Store.state;
    const occ = existing ? existing.date : null;
    let subs = clone(t.subtasks || []), atts = clone(t.attachments || []);
    const rec = t.recurrence || {};
    const recSel = !t.recurrence ? '' : t.recurrence.freq;
    UI.open(`<button class="btn ghost icon x" data-act="close-modal" aria-label="Fechar">${icon('x')}</button>
      <h2>${isNew ? 'Nova tarefa' : 'Editar'}</h2>
      ${existing && existing.rec ? `<p class="sub">Tarefa recorrente: as mudanças valem para todas as ocorrências.</p>` : '<div style="height:12px"></div>'}
      <div class="seg" style="margin-bottom:14px" role="group" aria-label="Tipo" id="ed-type">${[['task', '☑ Tarefa'], ['event', '📅 Compromisso'], ['reminder', '🔔 Lembrete']].map(([k, l]) => `<button type="button" data-v="${k}" aria-pressed="${t.type === k}">${l}</button>`).join('')}</div>

        <label class="field"><span>Data</span><input class="input" type="date" id="ed-date" value="${t.date || ''}"></label>

        <label class="field" id="ed-dur-f"><span>Duração</span><select class="input" id="ed-dur">${[5, 10, 15, 20, 30, 45, 60, 90, 120, 180, 240].concat([t.duration]).filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b).map(v => `<option value="${v}" ${t.duration === v ? 'selected' : ''}>${fmtDur(v)}</option>`).join('')}</select></label>
      </div>
      <div class="field"><span>Prioridade</span><div class="seg" id="ed-prio">${[1, 2, 3, 4].map(p => `<button type="button" data-v="${p}" aria-pressed="${t.priority === p}"><span style="color:var(--p${p})">●</span> ${PRIORITIES[p]}</button>`).join('')}</div></div>
      <div class="row2">
        <label class="field"><span>Lembrete</span><select class="input" id="ed-rem">${REMINDERS.concat(REMINDERS.some(r => r[0] === t.reminder) ? [] : [[t.reminder, reminderLabel(t.reminder)]]).map(([v, l]) => `<option value="${v ?? ''}" ${t.reminder === v ? 'selected' : ''}>${l}</option>`).join('')}<option value="custom">Personalizado…</option></select></label>
        <label class="field"><span>Repetir</span><select class="input" id="ed-rec">${[['', 'Não repete'], ['daily', 'Todos os dias'], ['weekdays', 'Dias da semana…'], ['weekly', 'Toda semana'], ['monthly', 'Todo mês'], ['yearly', 'Todo ano'], ['interval', 'A cada X dias']].map(([k, l]) => `<option value="${k}" ${recSel === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      <label class="field" id="ed-rem-c-f" hidden><span>Lembrar quantos minutos antes?</span><input class="input" type="number" min="0" max="20160" id="ed-rem-c" value="20"></label>
      <div id="ed-rec-x" class="field" ${recSel === 'weekdays' || recSel === 'interval' ? '' : 'hidden'}>
        <div class="days-row" id="ed-days" style="margin:0" ${recSel === 'interval' ? 'hidden' : ''}>${[1, 2, 3, 4, 5, 6, 0].map(d => `<button type="button" data-d="${d}" aria-pressed="${(rec.days || []).includes(d)}">${DOW_S[d]}</button>`).join('')}</div>
        <label class="field" id="ed-int-f" style="margin:0" ${recSel === 'interval' ? '' : 'hidden'}><span>A cada quantos dias?</span><input class="input" type="number" min="2" max="365" id="ed-int" value="${rec.interval || 2}"></label>
      </div>
      <label class="toggle" style="padding-top:0"><span>Lembrete persistente<small>Continua avisando até você concluir.</small></span><input type="checkbox" class="switch" id="ed-pers" ${t.persistent ? 'checked' : ''}></label>
      <label class="toggle"><span>🧠 Não esquecer<small>Fica em destaque até ser resolvido.</small></span><input type="checkbox" class="switch" id="ed-df" ${t.mustNotForget ? 'checked' : ''}></label>
      <div class="row2" style="margin-top:14px">
        <label class="field"><span>Projeto</span><select class="input" id="ed-proj"><option value="">Sem projeto</option>${s.projects.map(p => `<option value="${p.id}" ${t.projectId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
        <label class="field"><span>Etiquetas</span><input class="input" id="ed-tags" value="${esc((t.tags || []).join(', '))}" placeholder="cliente, site"></label>
      </div>
      <label class="field"><span>Descrição</span><textarea class="input" id="ed-desc" placeholder="Detalhes, links, observações">${esc(t.desc)}</textarea></label>
      <div class="field"><span>Subtarefas</span><div id="ed-subs"></div><div class="sub-row"><input class="input" id="ed-sub-new" placeholder="Adicionar subtarefa e Enter"></div></div>
      <div class="field"><span>Anexos (links)</span><div id="ed-atts"></div><div class="row2"><input class="input" id="ed-att-name" placeholder="Nome"><input class="input" id="ed-att-url" placeholder="https://… e Enter"></div></div>
      ${!isNew && !existing.rec ? `<label class="field"><span>Status</span><select class="input" id="ed-status">${[['pending', 'Pendente'], ['done', 'Concluída'], ['postponed', 'Adiada']].map(([k, l]) => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>` : ''}
      <div class="dialog-foot">${isNew ? '' : `<button class="btn danger left" id="ed-del">${icon('trash', 16)}Excluir</button>`}<button class="btn" data-act="close-modal">Cancelar</button><button class="btn primary" id="ed-save">Salvar</button></div>`, { cls: 'lg', label: 'Editar tarefa' });

    const segPick = (id, cb) => $('#' + id).addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (!b) return; $$('button', $('#' + id)).forEach(x => x.setAttribute('aria-pressed', x === b)); cb && cb(b.dataset.v); });

    drawSubs(); drawAtts();
    $('#ed-subs').addEventListener('change', e => { const k = +e.target.dataset.k; if (e.target.type === 'checkbox') subs[k].done = e.target.checked; else subs[k].title = e.target.value; });
    $('#ed-subs').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { subs.splice(+b.dataset.rm, 1); drawSubs(); } });

    $('#ed-sub-new').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) { e.preventDefault(); subs.push({ id: uid(), title: e.target.value.trim(), done: false }); e.target.value = ''; drawSubs(); } });
    $('#ed-att-url').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) { e.preventDefault(); let u = e.target.value.trim(); if (!/^https?:\/\//i.test(u)) u = 'https://' + u; atts.push({ id: uid(), name: $('#ed-att-name').value.trim(), url: u }); e.target.value = ''; $('#ed-att-name').value = ''; drawAtts(); } });
    if ($('#ed-del')) $('#ed-del').onclick = () => { UI.close(); Actions.delete({ key }); };
    $('#ed-save').onclick = () => {
      const title = $('#ed-title').value.trim(); if (!title) { $('#ed-title').focus(); return; }
      const pending = $('#ed-sub-new').value.trim(); if (pending) subs.push({ id: uid(), title: pending, done: false });
      const recV = $('#ed-rec').value; let recurrence = null;
      const date = $('#ed-date').value || null;
      if (recV) {
        recurrence = { freq: recV };
        if (recV === 'weekdays') { recurrence.days = $$('#ed-days button[aria-pressed="true"]').map(b => +b.dataset.d); if (!recurrence.days.length) recurrence.days = [parseYmd(date || todayStr()).getDay()]; }
        if (recV === 'interval') recurrence.interval = Math.max(2, +$('#ed-int').value || 2);
        if (recV === 'monthly') recurrence.monthDay = parseYmd(date || todayStr()).getDate();
      }
      const remV = $('#ed-rem').value;
      const patch = {
        title, type: $('#ed-type [aria-pressed="true"]').dataset.v, date: date || (recurrence ? todayStr() : null), time: $('#ed-time').value || null,
        duration: +$('#ed-dur').value, priority: +$('#ed-prio [aria-pressed="true"]').dataset.v, reminder: remV === '' ? null : remV === 'custom' ? Math.max(0, parseInt($('#ed-rem-c').value, 10) || 0) : +remV,
        persistent: $('#ed-pers').checked, mustNotForget: $('#ed-df').checked, projectId: $('#ed-proj').value || null,
        tags: $('#ed-tags').value.split(',').map(x => x.trim().replace(/^#/, '')).filter(Boolean), desc: $('#ed-desc').value, subtasks: subs, attachments: atts, recurrence,
      };
      if ($('#ed-status')) { const st = $('#ed-status').value; patch.status = st; patch.doneAt = st === 'done' ? (t.doneAt || Date.now()) : null; }
      Store.commit(s => {
        if (isNew) { s.tasks.push(mkTask(Object.assign(t, patch))); if (fromNote) s.notes = s.notes.filter(n => n.id !== fromNote); }
        else {
          const real = Tasks.byId(t.id);
          if (existing.rec && patch.time !== existing.t.time && real.timeOverrides) delete real.timeOverrides[occ];
          Object.assign(real, patch);
          if (patch.status === 'pending' || patch.status === 'postponed') real.snoozeUntil = 0;
        }
      });
      UI.close(); UI.snack(isNew ? 'Tarefa criada.' : 'Alterações salvas.');
    };

const recLabel = r => {
  if (!r) return '';
  switch (r.freq) {
    case 'daily': return 'Todos os dias';
    case 'weekdays': { const d = r.days || []; if (d.length === 5 && [1, 2, 3, 4, 5].every(x => d.includes(x))) return 'Dias úteis'; return 'Toda ' + d.map(x => DOW_S[x].toLowerCase()).join(', '); }
    case 'weekly': return 'Toda semana';
    case 'monthly': return r.monthDay ? `Todo dia ${r.monthDay}` : 'Todo mês';
    case 'yearly': return 'Todo ano';
    case 'interval': return `A cada ${r.interval} dias`;
  }
  return '';
};

/* ---------- modo foco ---------- */
const Focus = {
  el: null, timer: null, key: null, elapsed: 0, running: true,
  pick(key) {
    if (key) return Tasks.get(key);
    const T = todayStr(), nm = nowMin(), list = Tasks.on(T).filter(i => !i.done && i.t.type === 'task');
    return list.find(i => i.time && toMin(i.time) <= nm && toMin(i.time) + i.dur > nm) || list.filter(i => i.time && toMin(i.time) > nm)[0] || list.find(i => !i.time) || Tasks.overdue()[0] || null;
  },
  open(key) {
    const i = this.pick(key);
    if (!i) return UI.snack('Nenhuma tarefa pendente para hoje. Aproveite.');
    UI.close(); this.close(true); this.key = i.key; this.elapsed = 0; this.running = true;
    const el = document.createElement('div'); el.className = 'focus'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Modo foco'); this.el = el;
    document.body.appendChild(el); this.draw();
    this.timer = setInterval(() => { if (this.running) { this.elapsed++; this.tickUi(); } }, 1000);
  },
  draw() {
    const i = Tasks.get(this.key); if (!i) return this.close();
    const subs = i.t.subtasks || [];
    this.el.innerHTML = `<button class="btn ghost icon x" id="fx" aria-label="Sair do foco">${icon('x')}</button>
      <span class="lbl">Tarefa atual</span><h1>${esc(i.t.title)}</h1><span class="muted">${fmtDur(i.dur)} planejados</span>
      <div class="clock" id="fclock">00:00</div><div class="ring"><i id="fring" style="width:0"></i></div>
      ${subs.length ? `<div class="subs">${subs.map((s, k) => `<label class="ritem${s.done ? ' on' : ''}"><input type="checkbox" data-k="${k}" ${s.done ? 'checked' : ''}><span>${esc(s.title)}</span></label>`).join('')}</div>` : ''}
      <div class="acts"><button class="btn primary" id="fdone">${icon('check', 18)}Concluir</button><button class="btn" id="fpause">${icon(this.running ? 'pause' : 'play', 18)}${this.running ? 'Pausar' : 'Continuar'}</button><button class="btn" id="fpost">Adiar</button></div>`;
    this.tickUi();
    $('#fx', this.el).onclick = () => this.close();
    $('#fpause', this.el).onclick = () => { this.running = !this.running; this.draw(); };
    $('#fdone', this.el).onclick = () => { const k = this.key; Store.commit(s => Tasks._complete(s, k, true)); this.close(); const nx = this.pick(); UI.snack('Muito bem. Tarefa concluída.'); if (nx) setTimeout(() => UI.sheet('Próxima tarefa?', [{ act: 'focus', label: nx.t.title, icon: 'focus', hint: fmtDur(nx.dur), data: { key: nx.key } }, { act: 'close-modal', label: 'Agora não' }]), 300); };
    $('#fpost', this.el).onclick = () => { const k = this.key; this.close(); Modals.postpone(k); };
    this.el.onchange = e => { const k = +e.target.dataset.k; Store.commit(() => { const t = Tasks.get(this.key).t; t.subtasks[k].done = e.target.checked; }); e.target.closest('.ritem').classList.toggle('on', e.target.checked); };
  },
  tickUi() {
    const i = Tasks.get(this.key); if (!i || !this.el) return;
    const m = Math.floor(this.elapsed / 60), s = this.elapsed % 60;
    const c = $('#fclock', this.el), r = $('#fring', this.el);
    if (c) c.textContent = `${pad(m)}:${pad(s)}`;
    if (r) r.style.width = Math.min(100, this.elapsed / ((i.dur || 30) * 60) * 100) + '%';
  },
  close(silent) { clearInterval(this.timer); this.timer = null; if (this.el) { this.el.remove(); this.el = null; } },
};

/* ---------- primeiro acesso ---------- */
const Onboarding = {
  step: 0,
  slides: [
    ['Organize sua vida sem precisar lembrar de tudo.', 'Você coloca tudo na cabeça. O NOVA organiza, lembra e ajuda você a executar.'],
    ['Adicione tarefas.', 'Escreva como você fala: “me lembra amanhã às 15h de enviar o orçamento”.'],
    ['Escolha quando quer ser lembrado.', 'No horário, minutos antes ou um dia antes. As importantes podem insistir até você concluir.'],
    ['Deixe o NOVA organizar seu dia.', 'Ele encaixa as tarefas nos horários livres e avisa quando o dia está cheio demais.'],
  ],
  show() { this.step = 0; let el = $('.onb'); if (!el) { el = document.createElement('div'); el.className = 'onb'; document.body.appendChild(el); } this.el = el; this.draw(); },
  draw() {
    const s = Store.state.user, n = this.slides.length;
    if (this.step < n) {
      const [h, p] = this.slides[this.step];
      this.el.innerHTML = `<div class="onb-card"><div class="orbit"></div><div class="dots">${this.slides.map((_, k) => `<i class="${k <= this.step ? 'on' : ''}"></i>`).join('')}<i></i></div>
        <h1>${h}</h1><p>${p}</p><div class="foot"><button class="btn primary" id="ob-next">${this.step === n - 1 ? 'Vamos começar?' : 'Continuar'}</button>${this.step === 0 ? '' : '<button class="btn ghost" id="ob-back">Voltar</button>'}</div></div>`;
      $('#ob-next').onclick = () => { this.step++; this.draw(); };
      if ($('#ob-back')) $('#ob-back').onclick = () => { this.step--; this.draw(); };
      $('#ob-next').focus();
    } else {
      this.el.innerHTML = `<div class="onb-card"><div class="dots">${this.slides.map(() => '<i class="on"></i>').join('')}<i class="on"></i></div>
        <h1>Vamos começar?</h1><p>Isso ajuda a calcular quanto tempo você tem livre em cada dia.</p>
        <label class="field"><span>Como você quer ser chamado?</span><input class="input" id="ob-name" value="${esc(s.name)}" placeholder="Seu nome" autofocus></label>
        <div class="row2"><label class="field"><span>Seu dia começa às</span><input class="input" type="time" id="ob-s" value="${s.dayStart}"></label><label class="field"><span>E termina às</span><input class="input" type="time" id="ob-e" value="${s.dayEnd}"></label></div>
        <label class="toggle" style="margin-bottom:22px"><span>Manter exemplos<small>Tarefas de demonstração para conhecer o app. Você pode apagar depois.</small></span><input type="checkbox" class="switch" id="ob-demo" checked></label>
        <div class="foot"><button class="btn primary" id="ob-go">Começar</button></div></div>`;
      $('#ob-name').focus();
      $('#ob-go').onclick = () => {
        const name = $('#ob-name').value.trim(); if (!name) return $('#ob-name').focus();
        const st = $('#ob-s').value || '08:00', en = $('#ob-e').value || '18:00', demo = $('#ob-demo').checked;
        Store.commit(s => { Object.assign(s.user, { name, dayStart: st, dayEnd: toMin(en) > toMin(st) ? en : fromMin(toMin(st) + 600), onboarded: true }); if (!demo) { s.tasks = []; s.notes = []; s.routines = []; } });
        this.el.remove(); this.el = null;
      };
    }
  },
};

document.addEventListener('DOMContentLoaded', () => { if (Cloud.enabled()) Cloud.gate().then(() => App.init()); else App.init(); });
</script>
</body>
</html>
